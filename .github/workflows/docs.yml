name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ================================================================
# MkDocs Documentation Build (validation only)
# Issue #269: Automatic documentation generation
# Note: Deploy disabled - GitHub Pages requires paid plan for private repos
# ================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: ./.github/actions/setup-python-deps
        with:
          requirements: 'requirements-docs.txt'
          working-directory: '.'

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate API badges
        run: python scripts/validate_api_badges.py

      - name: Report success
        run: echo "✅ Documentation builds successfully"
