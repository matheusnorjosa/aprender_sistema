name: CI – Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------
  # Job 0: Backend impact detector
  #
  # Goal:
  # - Avoid full backend suite on PRs that do not touch backend-critical files.
  # - Keep non-PR events in safe full mode.
  # ----------------------------------------------------------------
  backend-impact:
    name: "[required] backend impact"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
      backend_changed_count: ${{ steps.detect.outputs.backend_changed_count }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      with:
        fetch-depth: 0

    - name: Detect backend impact
      id: detect
      run: |
        set -euo pipefail

        # Safety-first policy:
        # - PR: allow skip of backend-heavy jobs when no backend impact is detected.
        # - push/workflow_dispatch/other events: keep full backend gates enabled.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          echo "changed_files_count=0" >> "$GITHUB_OUTPUT"
          echo "backend_changed_count=0" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend Impact Detection"
            echo "- Event: ${{ github.event_name }}"
            echo "- Decision: backend_changed=true"
            echo "- Reason: non-PR event (safe full mode)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"

        if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          echo "changed_files_count=0" >> "$GITHUB_OUTPUT"
          echo "backend_changed_count=0" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend Impact Detection"
            echo "- Event: pull_request"
            echo "- Decision: backend_changed=true"
            echo "- Reason: missing PR base/head SHA (safe fallback)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
        CHANGED_COUNT="$(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

        # Conservative impact patterns to prevent false green:
        # includes backend app, backend runtime infra, backend tests and this CI workflow itself.
        BACKEND_IMPACT_REGEX='^(v2/backend/|v2/infra/|v2/tests/|v2/.dockerignore$|\.github/workflows/ci\.yaml$|\.github/workflows/_backend-test\.yml$)'
        BACKEND_MATCHED_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E "$BACKEND_IMPACT_REGEX" || true)"
        BACKEND_MATCHED_COUNT="$(printf '%s\n' "$BACKEND_MATCHED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

        BACKEND_CHANGED="false"
        if [ "$BACKEND_MATCHED_COUNT" -gt 0 ]; then
          BACKEND_CHANGED="true"
        fi

        echo "backend_changed=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
        echo "changed_files_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
        echo "backend_changed_count=$BACKEND_MATCHED_COUNT" >> "$GITHUB_OUTPUT"

        {
          echo "### Backend Impact Detection"
          echo "- Event: pull_request"
          echo "- Base SHA: $BASE_SHA"
          echo "- Head SHA: $HEAD_SHA"
          echo "- Changed files: $CHANGED_COUNT"
          echo "- Backend impact files: $BACKEND_MATCHED_COUNT"
          echo "- Decision: backend_changed=$BACKEND_CHANGED"
          if [ -n "$BACKEND_MATCHED_FILES" ]; then
            echo "- Matched files:"
            printf '%s\n' "$BACKEND_MATCHED_FILES" | sed 's/^/  - /'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------
  # Job 1: Lint (rápido, ~1min)
  # Migrado de v2-ci.yml após remoção
  # ----------------------------------------------------------------
  lint:
    name: "[required] lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install black isort flake8

      - name: Lint with Black
        run: |
          cd v2/backend
          black --check --diff .

      - name: Lint with isort
        run: |
          cd v2/backend
          isort --check-only --diff .

      - name: Lint with Flake8
        run: |
          cd v2/backend
          flake8 apps/ config/

      - name: Guard rail — no new /api/v1/ references (#796)
        run: |
          # Allowlist: files that legitimately reference /api/v1/
          ALLOWLIST=(
            "v2/backend/config/urls.py"               # URL alias definition
            "v2/backend/config/settings.py"           # Middleware registration + comments
            "v2/backend/apps/core/tests/test_versioning.py"  # Tests for alias
            "v2/backend/apps/core/deprecation.py"     # Decorator example
            "v2/backend/apps/core/middleware.py"       # Deprecation middleware
            "v2/backend/apps/core/api_schemas.py"     # Example URLs in docstrings
            "v2/backend/apps/core/views_solicitacao.py"  # Curl example in docstring
            "v2/backend/apps/core/management/commands/sync_municipios_ibge.py"  # IBGE external API
            "v2/docs/"                                 # Documentation
            ".claude/"                                 # AI context
          )

          PATTERN='/api/v1/'
          violations=0

          while IFS= read -r file; do
            allowed=false
            for entry in "${ALLOWLIST[@]}"; do
              if [[ "$file" == "$entry"* ]]; then
                allowed=true
                break
              fi
            done
            if [ "$allowed" = false ]; then
              echo "::error file=$file::Found /api/v1/ reference — use /api/ instead (see #796)"
              violations=$((violations + 1))
            fi
          done < <(grep -rl --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' "$PATTERN" v2/ .github/ || true)

          if [ "$violations" -gt 0 ]; then
            echo "::error::Found $violations file(s) with /api/v1/ outside allowlist. Use /api/ as canonical path."
            exit 1
          fi
          echo "✓ No new /api/v1/ references found outside allowlist."

  # ----------------------------------------------------------------
  # Job 1b: RBAC lint — Epic 6 RBAC Refactor guard
  # ----------------------------------------------------------------
  # AST-based custom lint que impede regressão capability → identity.
  # Regras:
  #   V001 — user.groups.filter(name=...) em views/services (use HasPerm)
  #   V002 — classes Is<Role> fora da whitelist (use HasPerm inline)
  # Ver: v2/backend/scripts/rbac_lint.py + v2/docs/RBAC_NAMING.md
  rbac-lint:
    name: "[required] backend rbac-lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'

      - name: Run RBAC lint (AST)
        run: |
          cd v2/backend
          python scripts/rbac_lint.py apps/

  # ----------------------------------------------------------------
  # Job 2a: Backend tests - core suite (paralelo, xdist -n auto)
  # ----------------------------------------------------------------
  backend-tests-core:
    name: "[info] backend tests core (runner)"
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    # Setup (services/env/migrate/dirs) centralizado no reusable. #1401.
    uses: ./.github/workflows/_backend-test.yml
    with:
      runner_timeout: 35
      pytest_paths: apps/core/tests
      # run_migrations=false + --no-migrations: pytest-django cria o schema dos
      # models (sem replay das 24 RunPython), cortando o setup de DB. Os seeds RBAC
      # vem das fixtures de sessao/funcao (ensure_base_groups + seed_functional_
      # permissions), nao das migrations. A cadeia RunPython e exercitada a parte no
      # job backend-migrate-integrity (deploy-safe). #1404.
      run_migrations: false
      # Paralelizacao xdist no gate (~15min->~5min). loadscope mantem testes da
      # mesma classe/modulo no mesmo worker. Habilitado apos #1402 estabilizar a
      # suite (re-seed RBAC pos-truncate; canary 0/4 em 2 runs consecutivos). #1403.
      pytest_extra_args: -n auto --dist loadscope --no-migrations
      coverage_file: .coverage.core
      validate_test_paths: true
      summary_title: Backend Core Tests Runtime
      artifact_name: backend-coverage-core
      artifact_paths: v2/backend/.coverage.core
      artifact_if_no_files: error

  # ----------------------------------------------------------------
  # Job 2b: Backend tests - ingest/devtools suite (paralelo, xdist -n auto)
  # ----------------------------------------------------------------
  backend-tests-ingest-devtools:
    name: "[info] backend tests ingest/devtools (runner)"
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    # Setup (services/env/migrate/dirs) centralizado no reusable. #1401.
    uses: ./.github/workflows/_backend-test.yml
    with:
      runner_timeout: 30
      pytest_paths: apps/dev_tools/tests
      run_migrations: false  # --no-migrations: schema dos models, sem replay das RunPython. #1404.
      pytest_extra_args: -n auto --dist loadscope --no-migrations  # xdist #1403 + --no-migrations #1404.
      coverage_file: .coverage.ingest_devtools
      summary_title: Backend Ingest/DevTools Tests Runtime
      artifact_name: backend-coverage-ingest-devtools
      artifact_paths: v2/backend/.coverage.ingest_devtools
      artifact_if_no_files: error

  # ----------------------------------------------------------------
  # Job 2b2: Migrate-integrity — rede de seguranca da cadeia RunPython.
  #
  # Os gates core/ingest rodam com --no-migrations (schema dos models, setup
  # rapido, #1404). Isso NAO exercita `manage.py migrate`, mas dev/prod aplicam
  # a cadeia real de migrations no deploy. Este job preenche essa lacuna:
  # run_migrations=true aplica as 24 RunPython em DB limpo (falha aqui = migration
  # quebrada, pega ANTES do deploy) e roda os testes `-m migrations` contra o DB
  # migrado. E gated pelo required `backend-tests` (needs + assert), sem mexer no
  # ruleset de branch protection.
  # ----------------------------------------------------------------
  backend-migrate-integrity:
    name: "[info] backend migrate-integrity"
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    uses: ./.github/workflows/_backend-test.yml
    with:
      runner_timeout: 20
      pytest_paths: apps/core/tests
      # run_migrations=true (default): aplica a cadeia RunPython em DB limpo.
      run_migrations: true
      pytest_extra_args: -m migrations
      summary_title: Backend Migrate-Integrity (cadeia RunPython)
      artifact_name: backend-migrate-integrity
      artifact_paths: v2/backend/.coverage.migrate_integrity
      artifact_if_no_files: ignore

  # ----------------------------------------------------------------
  # Job 2c: Backend coverage combine + required backend tests gate
  # ----------------------------------------------------------------
  backend-tests:
    name: "[required] backend tests (runner)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-impact
      - backend-tests-core
      - backend-tests-ingest-devtools
      - backend-migrate-integrity
    if: always() && needs.backend-impact.outputs.backend_changed == 'true'
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

    - uses: ./.github/actions/setup-python-deps
      with:
        requirements: 'requirements.txt requirements-dev.txt'

    - name: Assert split backend test jobs passed
      run: |
        if [ "${{ needs.backend-tests-core.result }}" != "success" ]; then
          echo "backend-tests-core failed with result=${{ needs.backend-tests-core.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.backend-tests-ingest-devtools.result }}" != "success" ]; then
          echo "backend-tests-ingest-devtools failed with result=${{ needs.backend-tests-ingest-devtools.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.backend-migrate-integrity.result }}" != "success" ]; then
          echo "backend-migrate-integrity failed with result=${{ needs.backend-migrate-integrity.result }}" >&2
          exit 1
        fi
        echo "Split backend test jobs passed."

    - name: Download backend coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: backend-coverage-*
        path: /tmp/backend-coverage
        digest-mismatch: warn

    - name: Combine coverage and enforce threshold
      run: |
        set -euo pipefail
        cd v2/backend

        CORE_COV="/tmp/backend-coverage/backend-coverage-core/.coverage.core"
        INGEST_COV="/tmp/backend-coverage/backend-coverage-ingest-devtools/.coverage.ingest_devtools"

        if [ ! -f "$CORE_COV" ] || [ ! -f "$INGEST_COV" ]; then
          echo "Missing coverage artifact(s) for combination." >&2
          ls -R /tmp/backend-coverage || true
          exit 1
        fi

        cp "$CORE_COV" .coverage.core
        cp "$INGEST_COV" .coverage.ingest_devtools

        coverage combine .coverage.core .coverage.ingest_devtools
        coverage report --fail-under=85
        coverage xml -o coverage.xml

        {
          echo "### Backend Coverage Combine"
          echo "- Source artifacts: core + ingest/devtools"
          echo "- Threshold enforced: 85%"
          echo "- Output XML: v2/backend/coverage.xml"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      # Sobe cobertura apenas quando o secret CODECOV_TOKEN existe; sem token o
      # codecov-action v4 falha o upload (tokenless rejeitado) e polui o log.
      if: ${{ env.CODECOV_TOKEN != '' }}
      with:
        token: ${{ env.CODECOV_TOKEN }}
        file: ./v2/backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # ----------------------------------------------------------------
  # Job 3: Backend typecheck with Pyright
  # Runs in parallel to keep typecheck out of backend test critical path.
  # ----------------------------------------------------------------
  backend-typecheck:
    name: "[required] backend typecheck (pyright)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

    - uses: ./.github/actions/setup-python-deps
      with:
        requirements: 'requirements.txt requirements-dev.txt'

    - name: Type check with Pyright
      run: |
        cd v2/backend
        pyright apps/core config

  # ----------------------------------------------------------------
  # Job 4: Docker parity (backend)
  #
  # Trade-off:
  # - Adds a complementary gate to catch "passes on runner, fails in container".
  # - Increases CI duration by a few minutes.
  #
  # Optimizations:
  # - Uses only smoke checks (lint subset + critical tests subset).
  # - Reuses Actions service containers (Postgres/Redis) instead of full compose stack.
  # ----------------------------------------------------------------
  docker-parity-backend:
    name: "[required] docker parity (backend)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'

    # Carve-out do reusable _backend-test.yml (#1401): topologia de container
    # (host.docker.internal, REQUIRE_DOCKER=1, migrate in-container, build buildx)
    # diverge do setup de runner. Ao bumpar postgres/redis aqui, sincronizar com o
    # services do reusable (SSOT das versoes).
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build backend image (Dockerfile.prod)
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: ./v2
        file: ./v2/infra/Dockerfile.prod
        push: false
        load: true
        tags: aprender-backend:ci-parity-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GIT_SHA=${{ github.sha }}

    - name: Run smoke checks inside container
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        ENVIRONMENT: testing
        DEBUG: "0"
        SECRET_KEY: test-secret-key-for-ci-only
        DB_HOST: host.docker.internal
        DB_PORT: "5432"
        DB_NAME: test_aprender
        DB_USER: postgres
        DB_PASSWORD: postgres
        REDIS_HOST: host.docker.internal
        REDIS_PORT: "6379"
        TZ: America/Fortaleza
        REQUIRE_DOCKER: "1"
        GCAL_CLIENT: fake
        GCAL_SEND_UPDATES: none
      run: |
        docker run --rm --add-host host.docker.internal:host-gateway \
          -e DJANGO_SETTINGS_MODULE \
          -e ENVIRONMENT \
          -e DEBUG \
          -e SECRET_KEY \
          -e DB_HOST \
          -e DB_PORT \
          -e DB_NAME \
          -e DB_USER \
          -e DB_PASSWORD \
          -e REDIS_HOST \
          -e REDIS_PORT \
          -e TZ \
          -e REQUIRE_DOCKER \
          -e GCAL_CLIENT \
          -e GCAL_SEND_UPDATES \
          aprender-backend:ci-parity-${{ github.sha }} \
          bash -c '
            set -euo pipefail
            # Use project baseline to avoid CI drift with hardcoded tool versions.
            # Note: bash -c (not -lc) preserves the ENV PATH from the Dockerfile,
            # which includes /opt/venv/bin. Login shell (-l) resets PATH via
            # /etc/profile, breaking venv-installed commands.
            pip install --no-cache-dir -r requirements.txt
            if [ -f requirements-dev.txt ]; then
              pip install --no-cache-dir -r requirements-dev.txt
            fi
            python manage.py migrate --noinput
            pytest -q --tb=short \
              apps/core/tests/test_modular_imports.py \
              apps/core/tests/test_auth_backends.py
          '

  # ----------------------------------------------------------------
  # Job 5: Required backend gate
  # Keeps the required "tests" check in ruleset while aggregating
  # runner tests + docker parity + typecheck.
  # ----------------------------------------------------------------
  tests:
    name: "[required] tests"
    runs-on: ubuntu-latest
    needs:
      - backend-impact
      - backend-tests
      - backend-typecheck
      - docker-parity-backend
    if: always()
    timeout-minutes: 5
    steps:
    - name: Assert backend gates passed
      run: |
        if [ "${{ needs.backend-impact.result }}" != "success" ]; then
          echo "backend-impact failed with result=${{ needs.backend-impact.result }}" >&2
          exit 1
        fi

        BACKEND_CHANGED="${{ needs.backend-impact.outputs.backend_changed }}"
        echo "backend_changed=${BACKEND_CHANGED}"

        if [ "${BACKEND_CHANGED}" = "true" ]; then
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed with result=${{ needs.backend-tests.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.backend-typecheck.result }}" != "success" ]; then
            echo "backend-typecheck failed with result=${{ needs.backend-typecheck.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.docker-parity-backend.result }}" != "success" ]; then
            echo "docker-parity-backend failed with result=${{ needs.docker-parity-backend.result }}" >&2
            exit 1
          fi
          echo "Backend impact detected: required backend jobs passed."
          exit 0
        fi

        if [ "${{ needs.backend-tests.result }}" != "skipped" ]; then
          echo "Expected backend-tests=skipped when backend_changed=false, got result=${{ needs.backend-tests.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.backend-typecheck.result }}" != "skipped" ]; then
          echo "Expected backend-typecheck=skipped when backend_changed=false, got result=${{ needs.backend-typecheck.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.docker-parity-backend.result }}" != "skipped" ]; then
          echo "Expected docker-parity-backend=skipped when backend_changed=false, got result=${{ needs.docker-parity-backend.result }}" >&2
          exit 1
        fi
        echo "No backend impact detected: backend-heavy jobs skipped as expected."
