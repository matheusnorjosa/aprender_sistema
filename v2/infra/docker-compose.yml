version: "3.9"

# ================================================================
# AS v2 — Docker Compose Configuration
# ================================================================
# Services: db, redis, web, worker, beat
# ================================================================

services:
  # ============================================================
  # PostgreSQL 15
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: as_v2_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aprender_db}
      POSTGRES_USER: ${POSTGRES_USER:-aprender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aprender_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
      TZ: America/Fortaleza
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aprender_user} -d ${POSTGRES_DB:-aprender_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - as_network

  # ============================================================
  # Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: as_v2_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: America/Fortaleza
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - as_network

  # ============================================================
  # Django Web (Gunicorn)
  # ============================================================
  web:
    build:
      context: ../
      dockerfile: infra/Dockerfile
      target: runtime
    container_name: as_v2_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads 2 --timeout 60 --access-logfile - --error-logfile -
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: config.settings.${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-aprender_db}
      DB_USER: ${POSTGRES_USER:-aprender_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aprender_password}
      DB_HOST: db
      DB_PORT: 5432

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Timezone
      TZ: America/Fortaleza

      # Docker enforcement
      REQUIRE_DOCKER: "1"

      # Google Calendar (opcional)
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_PATH: /app/service_account.json

      # Sentry (opcional)
      SENTRY_DSN: ${SENTRY_DSN:-}

    volumes:
      - ../backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ${GOOGLE_SERVICE_ACCOUNT_PATH:-./service_account.json}:/app/service_account.json:ro
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - as_network

  # ============================================================
  # Celery Worker (Tarefas Assíncronas)
  # ============================================================
  worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
      target: runtime
    container_name: as_v2_worker
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: config.settings.${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-in-production}

      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-aprender_db}
      DB_USER: ${POSTGRES_USER:-aprender_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aprender_password}
      DB_HOST: db
      DB_PORT: 5432

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Timezone
      TZ: America/Fortaleza

      # Docker enforcement
      REQUIRE_DOCKER: "1"

      # Google Calendar
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_PATH: /app/service_account.json

    volumes:
      - ../backend:/app
      - logs_volume:/app/logs
      - ${GOOGLE_SERVICE_ACCOUNT_PATH:-./service_account.json}:/app/service_account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - as_network

  # ============================================================
  # Celery Beat (Tarefas Agendadas)
  # ============================================================
  beat:
    build:
      context: ../
      dockerfile: infra/Dockerfile
      target: runtime
    container_name: as_v2_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: config.settings.${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-in-production}

      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-aprender_db}
      DB_USER: ${POSTGRES_USER:-aprender_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aprender_password}
      DB_HOST: db
      DB_PORT: 5432

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Timezone
      TZ: America/Fortaleza

      # Docker enforcement
      REQUIRE_DOCKER: "1"

    volumes:
      - ../backend:/app
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - as_network

# ================================================================
# Volumes
# ================================================================
volumes:
  pg_data:
    name: as_v2_pg_data
  redis_data:
    name: as_v2_redis_data
  static_volume:
    name: as_v2_static
  media_volume:
    name: as_v2_media
  logs_volume:
    name: as_v2_logs

# ================================================================
# Networks
# ================================================================
networks:
  as_network:
    name: as_v2_network
    driver: bridge
