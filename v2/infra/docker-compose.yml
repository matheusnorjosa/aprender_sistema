name: aprender_v2
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # CP2: Redis persistence com RDB snapshots
    # save 60 1 = snapshot a cada 60s se houver >= 1 mudança
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: gunicorn config.wsgi:application --config /app/infra/gunicorn.conf.py
    env_file: .env
    environment:
      # Gunicorn Configuration (CP1 - Performance Optimization)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
    depends_on:
      - db
      - redis
    ports:
      - "8002:8000"
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/readyz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    environment:
      SERVICE_NAME: worker  # MP2: Structured logging service identification
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config beat -l info
    env_file: .env
    environment:
      SERVICE_NAME: beat  # MP2: Structured logging service identification
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import celery; print(celery.__version__)' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ================================================================
  # MP1: Observability Stack (Prometheus + Grafana + Exporters)
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  redis_data:  # CP2: Persistência Redis (sessões)
  prometheus_data:  # MP1: Prometheus metrics storage
  grafana_data:  # MP1: Grafana dashboards and config
