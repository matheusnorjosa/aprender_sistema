name: 🛡️ Branch Protection & Rules

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  setup-branch-protection:
    name: 🔒 Configurar Proteção de Branches
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔐 Setup Branch Protection Rules
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          
          // Proteção para branch MAIN
          try {
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: ['code-quality', 'tests']
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false
            });
            console.log('✅ Proteção configurada para branch main');
          } catch (error) {
            console.log('⚠️  Erro ao configurar proteção para main:', error.message);
          }
          
          // Proteção para branch DEVELOP
          try {
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'develop',
              required_status_checks: {
                strict: true,
                contexts: ['code-quality', 'tests']
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: false,
                require_code_owner_reviews: false
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false
            });
            console.log('✅ Proteção configurada para branch develop');
          } catch (error) {
            console.log('⚠️  Erro ao configurar proteção para develop:', error.message);
          }