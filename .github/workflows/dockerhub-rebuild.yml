name: Docker Hub Rebuild

on:
  schedule:
    # Weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish images to Docker Hub after security gate"
        required: true
        type: boolean
        default: true

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

permissions:
  contents: read

concurrency:
  group: dockerhub-rebuild
  cancel-in-progress: false

jobs:
  rebuild-and-publish:
    name: "[ops] rebuild Docker Hub images (weekly)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Generate maintenance tag
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          MAINTENANCE_TAG="maint-$(date -u +%Y.%m.%d)-${SHORT_SHA}-r${GITHUB_RUN_ID}"
          echo "maintenance_tag=$MAINTENANCE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Generated maintenance tag: $MAINTENANCE_TAG"

      - name: Resolve publish mode
        id: publish-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref }}
          DISPATCH_PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: |
          set -euo pipefail
          publish_images="false"
          publish_reason="manual-skip"

          if [ "$GITHUB_REF_NAME" != "refs/heads/main" ]; then
            publish_images="false"
            publish_reason="non-main-ref"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            publish_images="true"
            publish_reason="scheduled-main"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_PUBLISH_IMAGES" in
              true)
                publish_images="true"
                publish_reason="dispatch-enabled"
                ;;
              false)
                publish_images="false"
                publish_reason="dispatch-disabled"
                ;;
              *)
                publish_images="true"
                publish_reason="dispatch-default"
                ;;
            esac
          fi

          echo "publish_images=$publish_images" >> "$GITHUB_OUTPUT"
          echo "publish_reason=$publish_reason" >> "$GITHUB_OUTPUT"
          echo "Publish images: $publish_images ($publish_reason)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare security and metrics artifacts
        run: |
          set -euo pipefail
          mkdir -p supply-chain/security supply-chain/rebuild

          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "repository=${{ github.repository }}"
            echo "event_name=${{ github.event_name }}"
            echo "git_sha=${{ github.sha }}"
            echo "short_sha=${{ steps.version.outputs.short_sha }}"
            echo "maintenance_tag=${{ steps.version.outputs.maintenance_tag }}"
            echo "publish_images=${{ steps.publish-mode.outputs.publish_images }}"
            echo "publish_reason=${{ steps.publish-mode.outputs.publish_reason }}"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > supply-chain/rebuild/rebuild-metrics.txt

      - name: Build Backend image for pre-publish scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: false
          load: true
          tags: aprender-backend:weekly-scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image for pre-publish scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: false
          load: true
          tags: aprender-frontend:weekly-scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Trivy report (backend)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: aprender-backend:weekly-scan-${{ github.run_id }}
          format: json
          output: supply-chain/security/trivy-backend-weekly.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Generate Trivy report (frontend)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: aprender-frontend:weekly-scan-${{ github.run_id }}
          format: json
          output: supply-chain/security/trivy-frontend-weekly.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Enforce security gate (block HIGH/CRITICAL before publish)
        id: security-gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          backend_report = "supply-chain/security/trivy-backend-weekly.json"
          frontend_report = "supply-chain/security/trivy-frontend-weekly.json"
          summary_file = "supply-chain/security/gate-summary.txt"
          metrics_file = "supply-chain/rebuild/rebuild-metrics.txt"
          output_file = os.environ["GITHUB_OUTPUT"]

          def count_blocking(path: str) -> int:
              with open(path, encoding="utf-8") as fp:
                  data = json.load(fp)
              total = 0
              for result in data.get("Results", []):
                  for vuln in result.get("Vulnerabilities", []) or []:
                      if vuln.get("Severity") in {"HIGH", "CRITICAL"}:
                          total += 1
              return total

          backend_blocking = count_blocking(backend_report)
          frontend_blocking = count_blocking(frontend_report)
          total_blocking = backend_blocking + frontend_blocking

          print(f"Backend HIGH/CRITICAL vulnerabilities: {backend_blocking}")
          print(f"Frontend HIGH/CRITICAL vulnerabilities: {frontend_blocking}")
          print(f"Total HIGH/CRITICAL vulnerabilities: {total_blocking}")

          with open(summary_file, "w", encoding="utf-8") as fp:
              fp.write(f"backend_high_critical={backend_blocking}\n")
              fp.write(f"frontend_high_critical={frontend_blocking}\n")
              fp.write(f"total_high_critical={total_blocking}\n")

          with open(metrics_file, "a", encoding="utf-8") as fp:
              fp.write(f"backend_high_critical={backend_blocking}\n")
              fp.write(f"frontend_high_critical={frontend_blocking}\n")
              fp.write(f"total_high_critical={total_blocking}\n")

          with open(output_file, "a", encoding="utf-8") as fp:
              fp.write(f"backend_high_critical={backend_blocking}\n")
              fp.write(f"frontend_high_critical={frontend_blocking}\n")
              fp.write(f"total_high_critical={total_blocking}\n")

          if total_blocking > 0:
              print("Rebuild publish blocked: HIGH/CRITICAL vulnerabilities detected.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Login to Docker Hub
        if: steps.publish-mode.outputs.publish_images == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend image (maintenance + latest)
        id: push-backend
        if: steps.publish-mode.outputs.publish_images == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.maintenance_tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Backend
            org.opencontainers.image.description=Weekly rebuilt Django backend image
            org.opencontainers.image.version=${{ steps.version.outputs.maintenance_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image (maintenance + latest)
        id: push-frontend
        if: steps.publish-mode.outputs.publish_images == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.maintenance_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Frontend
            org.opencontainers.image.description=Weekly rebuilt React frontend image
            org.opencontainers.image.version=${{ steps.version.outputs.maintenance_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Finalize rebuild metrics
        if: always()
        run: |
          set -euo pipefail
          {
            echo "security_gate_outcome=${{ steps.security-gate.outcome }}"
            echo "backend_push_outcome=${{ steps.push-backend.outcome }}"
            echo "frontend_push_outcome=${{ steps.push-frontend.outcome }}"
            echo "backend_digest=${{ steps.push-backend.outputs.digest }}"
            echo "frontend_digest=${{ steps.push-frontend.outputs.digest }}"
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> supply-chain/rebuild/rebuild-metrics.txt

      - name: Upload weekly rebuild artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockerhub-rebuild-${{ github.run_id }}
          path: |
            supply-chain/security/
            supply-chain/rebuild/
          if-no-files-found: warn
          retention-days: 30
