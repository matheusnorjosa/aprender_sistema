name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2025.10.08)'
        required: true
        default: 'v2025.10.08'
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r v2/backend/requirements.txt

    - name: Run final checks
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        ENVIRONMENT: production
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        REQUIRE_DOCKER: "0"
      run: |
        cd v2/backend
        python manage.py check --deploy

    - name: Create tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
        git push origin "${{ github.event.inputs.version }}"

    - name: Build Docker image
      run: |
        cd v2
        docker build -f infra/Dockerfile -t aprender-sistema:${{ github.event.inputs.version }} .
        docker tag aprender-sistema:${{ github.event.inputs.version }} aprender-sistema:latest

    - name: Generate release notes
      run: |
        echo "# Release ${{ github.event.inputs.version }}" > release_notes.md
        echo "" >> release_notes.md
        echo "**Environment:** ${{ github.event.inputs.environment }}" >> release_notes.md
        echo "**Date:** $(date -u +%Y-%m-%d)" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Changes" >> release_notes.md
        echo "" >> release_notes.md
        git log --oneline --since="$(git describe --tags --abbrev=0 HEAD~1)" >> release_notes.md

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        release_name: Release ${{ github.event.inputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false

    - name: Upload Docker image
      if: github.event.inputs.environment == 'production'
      run: |
        echo "Docker image built: aprender-sistema:${{ github.event.inputs.version }}"
        echo "Ready for deployment to ${{ github.event.inputs.environment }}"

    - name: Deploy to staging
      if: github.event.inputs.environment == 'staging'
      run: |
        echo "Deploying to staging environment..."
        # Add staging deployment commands here

    - name: Deploy to production
      if: github.event.inputs.environment == 'production'
      run: |
        echo "Deploying to production environment..."
        # Add production deployment commands here
