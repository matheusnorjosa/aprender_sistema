# ============================================================
# Python tooling (inside container)
# ============================================================

[filters.pyright-strict]
description = "Keep only pyright errors and summary"
match_command = "^pyright\\b"
strip_ansi = true
strip_lines_matching = [
    "^\\s*$",
    "^\\s+\\(reportUnknownMemberType\\)",
    "^\\s+\\(reportUnknownVariableType\\)",
]

[[tests.pyright-strict]]
name = "keeps the indented Type lines that explain the error"
input = """
/app/apps/core/exemplo.py
  /app/apps/core/exemplo.py:13:9 - error: Argument of type "(x: int) -> None" cannot be assigned to parameter "cb" of type "(str) -> None" in function "aplicar"
    Type "(x: int) -> None" is not assignable to type "(str) -> None"
      Parameter 1: type "str" is incompatible with type "int"
        "str" is not assignable to "int" (reportArgumentType)

1 error, 0 warnings, 0 informations
"""
expected = """
/app/apps/core/exemplo.py
  /app/apps/core/exemplo.py:13:9 - error: Argument of type "(x: int) -> None" cannot be assigned to parameter "cb" of type "(str) -> None" in function "aplicar"
