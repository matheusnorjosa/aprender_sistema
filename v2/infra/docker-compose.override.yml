# docker-compose.override.yml
# Overrides for local development
#
# This file is automatically loaded by docker-compose and overrides
# settings from docker-compose.yml for local development.
#
# Benefits:
# - Code changes reflect immediately (no rebuild needed)
# - Faster iteration during development
# - Pyright/IDE can see live changes
#
# Staging/Production: this file must NOT be applied.
# Use only docker-compose.yml (staging) or docker-compose.prod.yml (producao).

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      # Mount backend code as volume for live reload
      - ../backend:/app:delegated
      # Keep csv-import as read-only
      - ../data/csv-import:/app/data/csv-import:ro

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      # Mount backend code as volume for live reload
      - ../backend:/app:delegated
      - ../data/csv-import:/app/data/csv-import:ro

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      # Mount backend code as volume for live reload
      - ../backend:/app:delegated
      - ../data/csv-import:/app/data/csv-import:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      # Mount frontend code as read-only for hot reload in local dev
      - ../frontend/src:/app/src:ro
      - ../frontend/public:/app/public:ro
