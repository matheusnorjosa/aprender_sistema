databases:
  - name: aprender-sistema-db
    databaseName: aprender_sistema
    user: aprender_user

services:
  - type: web
    name: aprender-sistema
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn aprender_sistema.wsgi:application"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aprender-sistema-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
      - key: FEATURE_GOOGLE_SYNC
        value: "0"