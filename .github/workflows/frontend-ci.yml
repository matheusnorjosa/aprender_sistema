name: frontend-ci

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'v2/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, feat/dashboard-compras-etl ]
    # Removed path filters for pull_request to ensure required check always runs
    # This is needed because the ruleset requires "frontend-ci" as a status check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep npm installs deterministic via lockfile, but reduce network overhead in CI.
  NPM_CONFIG_PREFER_OFFLINE: 'true'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  react-doctor:
    name: "[required] react doctor quality gate"
    # npm ci + react-doctor are CPU-intensive; ubuntu-slim (1 vCPU) caused 2.5x slowdown.
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        # React Doctor gate here runs full score mode (no git diff analysis),
        # so shallow checkout is enough and faster.
        # If diff-based React Doctor mode is introduced, switch to fetch-depth: 0.
        fetch-depth: 1

    - name: Setup Node.js 20.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: v2/frontend

    - name: Run React Doctor quality gate
      run: node v2/scripts/react-doctor-gate.mjs v2/frontend
      env:
        REACT_DOCTOR_MIN_SCORE: '75'

  build-lint-frontend:
    name: "[required] build/lint do frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build with Vite
      run: npm run build

    - name: Run tests
      run: npm run test

    - name: Check bundle sizes
      run: npm run size

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      continue-on-error: true
      with:
        name: frontend-build
        path: v2/frontend/dist
        retention-days: 1

  checklist-tests:
    name: "[required] checklist tests (meta, a11y, security)"
    runs-on: ubuntu-latest
    # Runs in parallel with build/lint to reduce critical path.
    # Checklist does not consume build artifacts from build-lint-frontend.
    timeout-minutes: 25
    env:
      # Controlled experiment (Issue #650): increase checklist concurrency.
      # Fast rollback: set to 1 if retries/flakiness increase.
      CHECKLIST_PLAYWRIGHT_WORKERS: '2'

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps

    - name: Start backend services for functional contract checklist
      working-directory: .
      run: |
        cp v2/infra/.env.example v2/infra/.env
        DB_NAME="$(grep -m1 '^DB_NAME=' v2/infra/.env | cut -d'=' -f2- | tr -d '\r')"
        DB_USER="$(grep -m1 '^DB_USER=' v2/infra/.env | cut -d'=' -f2- | tr -d '\r')"
        DB_PASSWORD="$(grep -m1 '^DB_PASSWORD=' v2/infra/.env | cut -d'=' -f2- | tr -d '\r')"

        if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
          echo "DB_* variables could not be parsed from v2/infra/.env"
          exit 1
        fi

        {
          echo "POSTGRES_DB=$DB_NAME"
          echo "POSTGRES_USER=$DB_USER"
          echo "POSTGRES_PASSWORD=$DB_PASSWORD"
        } >> v2/infra/.env

        export IMAGE_TAG=latest
        compose() {
          docker compose -f v2/infra/docker-compose.yml -f v2/infra/docker-compose.override.yml "$@"
        }

        compose up -d --build db redis web

        for i in $(seq 1 60); do
          if compose exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
            echo "PostgreSQL is ready"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "PostgreSQL did not become ready in time"
            compose logs db
            exit 1
          fi
          sleep 2
        done

        for i in $(seq 1 30); do
          if compose exec -T web getent hosts db >/dev/null 2>&1; then
            echo "Web can resolve db service"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "Web could not resolve db service in time"
            compose logs web db
            exit 1
          fi
          sleep 1
        done

        compose exec -T web python manage.py migrate --noinput
        compose exec -T web python manage.py seed_frontend_contract_data

    - name: Run checklist tests
      run: npm run test:checklist -- --workers=${CHECKLIST_PLAYWRIGHT_WORKERS}
      env:
        # PR CI does not run behind production-grade reverse proxy headers.
        # Keep strict header assertions opt-in via STRICT_SECURITY_HEADERS=1.
        STRICT_SECURITY_HEADERS: '0'

    - name: Stop backend services used by checklist
      if: always()
      working-directory: .
      run: IMAGE_TAG=latest docker compose -f v2/infra/docker-compose.yml -f v2/infra/docker-compose.override.yml down -v || true

    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      continue-on-error: true
      with:
        name: checklist-test-results
        path: v2/frontend/test-results
        # Checklist can pass without generating this directory (reporter=list).
        if-no-files-found: ignore
        retention-days: 7

  lighthouse-ci:
    name: "[info] lighthouse CI"
    runs-on: ubuntu-latest
    needs: build-lint-frontend
    if: github.event_name == 'pull_request'
    timeout-minutes: 12

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Setup Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
      with:
        chrome-version: stable

    - name: Show Chrome version
      run: ${{ steps.setup-chrome.outputs.chrome-path }} --version

    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: frontend-build
        path: v2/frontend/dist

    - name: Run Lighthouse CI
      run: npm run lighthouse:ci
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      # Informational-only until fixed CI budgets are agreed for this repository.
      continue-on-error: true

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      continue-on-error: true
      with:
        name: lighthouse-results
        path: v2/frontend/.lighthouseci
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 7
