# Composite action: Setup Node.js with cached node_modules
# Follows Sentry pattern — caches node_modules directly to skip npm ci on hit.
# Used by: frontend-ci.yml, security-scan.yml, architecture-guardrails.yml,
#          dependency-review-scorecard.yml
name: 'Setup Node.js with cached dependencies'
description: 'Install Node.js and npm dependencies with node_modules caching'

inputs:
  node-version:
    description: 'Node.js version'
    default: '22.x'
  working-directory:
    description: 'Directory containing package.json'
    default: 'v2/frontend'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v4
      id: npm-cache
      with:
        path: ${{ inputs.working-directory }}/node_modules
        # O .npmrc entra na chave porque muda o que o `npm ci` instala
        # (ignore-scripts); só com o lockfile, mexer nele reusaria o cache antigo.
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory), format('{0}/.npmrc', inputs.working-directory)) }}

    # Antes do `npm ci` e também no cache hit: sem o .npmrc a chave volta a ser a
    # antiga e restauraria um node_modules instalado com scripts. Todos os
    # callers usam o default v2/frontend, que tem o .npmrc.
    - name: Guard — ignore-scripts ativo
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "$(npm config get ignore-scripts)" != true ]; then
          echo "::error::ignore-scripts desligado (falta ${{ inputs.working-directory }}/.npmrc?)"
          exit 1
        fi

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
