# PostgreSQL config para AS v2
# VM02: 4 vCPU, 16GB RAM, 300GB SSD
# Copy relevant settings to /etc/postgresql/15/main/postgresql.conf

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------
listen_addresses = '10.0.0.2'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------
# 25% of RAM for shared buffers
shared_buffers = 4GB

# 75% of RAM for estimated cache
effective_cache_size = 12GB

# Memory for sort/hash operations
work_mem = 64MB

# Memory for VACUUM, CREATE INDEX
maintenance_work_mem = 1GB

# WAL buffers
wal_buffers = 64MB

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------
# For SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Parallel queries
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Statistics
default_statistics_target = 100

#------------------------------------------------------------------------------
# WAL / CHECKPOINTS
#------------------------------------------------------------------------------
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Archive (for incremental backup)
archive_mode = on
archive_command = 'gzip < %p > /var/lib/postgresql/wal_archive/%f.gz'
archive_timeout = 300

#------------------------------------------------------------------------------
# REPLICATION (prepared for future)
#------------------------------------------------------------------------------
max_wal_senders = 3
wal_keep_size = 1GB

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries (>500ms)
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

#------------------------------------------------------------------------------
# LOCALE
#------------------------------------------------------------------------------
lc_messages = 'en_US.UTF-8'
lc_monetary = 'pt_BR.UTF-8'
lc_numeric = 'pt_BR.UTF-8'
lc_time = 'pt_BR.UTF-8'
default_text_search_config = 'pg_catalog.portuguese'
