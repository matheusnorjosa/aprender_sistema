{% load static %}
<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Solicitar Evento</title></head>
  <body>
    <h1>Solicitar Evento</h1>
    {% if messages %}
      <ul>
        {% for m in messages %}
          <li>{{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <table>
        {{ form.as_table }}
      </table>
      <button type="submit">Enviar Solicitação</button>
    </form>
  </body>
</html>
