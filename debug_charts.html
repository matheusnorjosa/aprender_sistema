<!DOCTYPE html>
<html>
<head>
    <title>Debug - Teste APIs Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Debug - Teste das APIs do Dashboard</h1>
    
    <div id="debug-info">
        <h2>Debug Info</h2>
        <div id="debug-logs"></div>
    </div>
    
    <div style="margin-top: 20px;">
        <h2>Teste API monthly_evolution</h2>
        <div id="api-result"></div>
        <canvas id="testChart" width="400" height="200"></canvas>
    </div>
    
    <script>
        // Função para log
        function debugLog(message) {
            const logs = document.getElementById('debug-logs');
            logs.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
            console.log(message);
        }
        
        // Testar se Chart.js carregou
        debugLog('Chart.js disponível: ' + (typeof Chart !== 'undefined'));
        
        // Testar API
        async function testAPI() {
            debugLog('Iniciando teste da API...');
            
            try {
                const response = await fetch('/diretoria/api/charts/?chart=monthly_evolution');
                debugLog('Status da resposta: ' + response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    debugLog('Erro HTTP: ' + errorText.substring(0, 200));
                    document.getElementById('api-result').innerHTML = 
                        '<div style="color: red;">Erro ' + response.status + ': ' + errorText.substring(0, 200) + '</div>';
                    return;
                }
                
                const data = await response.json();
                debugLog('Dados recebidos: ' + JSON.stringify(data).substring(0, 200));
                
                document.getElementById('api-result').innerHTML = 
                    '<div style="color: green;">Sucesso! Dados: ' + JSON.stringify(data, null, 2) + '</div>';
                
                // Tentar criar gráfico simples
                if (data && data.data && data.data.length > 0) {
                    debugLog('Criando gráfico teste...');
                    
                    const ctx = document.getElementById('testChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.data.map(item => item.mes || 'Sem mês'),
                            datasets: [{
                                label: 'Total',
                                data: data.data.map(item => item.total || 0),
                                backgroundColor: 'rgba(52, 152, 219, 0.8)'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Teste - Evolução Mensal'
                                }
                            }
                        }
                    });
                    
                    debugLog('Gráfico criado com sucesso!');
                } else {
                    debugLog('Dados insuficientes para criar gráfico');
                }
                
            } catch (error) {
                debugLog('Erro JavaScript: ' + error.message);
                document.getElementById('api-result').innerHTML = 
                    '<div style="color: red;">Erro JavaScript: ' + error.message + '</div>';
            }
        }
        
        // Executar teste quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('DOM carregado, iniciando testes...');
            
            // Aguardar um pouco para garantir que tudo carregou
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
