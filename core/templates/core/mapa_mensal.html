<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Disponibilidade | Mapa Mensal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --text:#222; --muted:#6b7280; --grid-border:#e5e7eb;
      --evento:#3b82f6; --multi:#b91c1c; --desloc:#f59e0b; --bloq-total:#111827; --bloq-parc:#9ca3af; --conflito:#dc2626;
      --badge-bg:#b91c1c; --badge:#fff; --hover:#eff6ff; --head:#fafafa; --sticky:#f3f4f6;
    }
    body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin:0; padding:24px;}
    .wrap{max-width:1200px; margin:0 auto;}
    .card{background:var(--card); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:16px;}
    .toolbar{display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
    .toolbar h1{font-size:18px; margin:0; font-weight:700}
    .spacer{flex:1}
    .sel,.btn{padding:8px 10px; border:1px solid var(--grid-border); border-radius:8px; background:#fff}
    .btn{cursor:pointer} .btn:hover{background:#f8fafc}
    .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:10px}
    .legend .dot{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle}
    .table-wrap{overflow:auto; border:1px solid var(--grid-border); border-radius:12px}
    table{border-collapse:separate; border-spacing:0; width:100%; min-width:700px}
    thead th{position:sticky; top:0; background:var(--head); z-index:2}
    tbody th{position:sticky; left:0; background:var(--sticky); z-index:1; text-align:left}
    th,td{border-bottom:1px solid var(--grid-border); border-right:1px solid var(--grid-border); padding:4px; font-size:10px}
    thead th{padding:6px 4px; font-weight:700}
    tbody tr:hover td{background:var(--hover)}
    .cell{width:16px; height:16px; text-align:center; border-radius:3px; position:relative; user-select:none}
    .c-empty{background:transparent}
    .c-event{background:var(--evento)}
    .c-desloc{background:var(--desloc)}
    .c-block-total{background:var(--bloq-total); color:#fff}
    .c-block-parc{background:var(--bloq-parc); color:#fff}
    .c-conflict{background:var(--conflito); position:relative; animation:pulse 2s infinite}
    .c-conflict::after{content:"✕"; color:#fff; font-weight:900; font-size:10px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-shadow:0 1px 2px rgba(0,0,0,0.3)}
    @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.8}}
    .badge{position:absolute; top:-4px; right:-4px; font-size:8px; line-height:1; background:var(--badge-bg); color:var(--badge); border-radius:8px; padding:2px 3px; min-width:10px; text-align:center}
    .c-desloc .badge{background:#1f2937}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <h1>Mapa Mensal de Disponibilidade</h1>
      <div class="spacer"></div>
      <select id="selMes" class="sel"></select>
      <select id="selAno" class="sel"></select>
      <button id="btnAtualizar" class="btn">Atualizar</button>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:var(--evento)"></span>Evento</span>
      <span><span class="dot" style="background:var(--badge-bg)"></span>Mais de um evento</span>
      <span><span class="dot" style="background:var(--desloc)"></span>Deslocamento</span>
      <span><span class="dot" style="background:var(--bloq-parc)"></span>Bloqueio Parcial (P)</span>
      <span><span class="dot" style="background:var(--bloq-total)"></span>Bloqueio Total (T)</span>
      <span><span class="dot" style="background:var(--conflito)"></span>Conflito (✕)</span>
    </div>

    <div class="card table-wrap">
      <table id="grid">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="bodyRows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const mNames = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
    function fillSelectors(){
      const now = new Date();
      selMes.innerHTML = mNames.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
      const anoAtual = now.getFullYear(); const anos=[anoAtual-1, anoAtual, anoAtual+1];
      selAno.innerHTML = anos.map(a=>`<option value="${a}">${a}</option>`).join('');
      selMes.value = now.getMonth()+1; selAno.value = anoAtual;
    }

    function codeToCell(code){
      if(!code || code === "-") return {cls:"c-empty", badge:"", text:""};
      if(code === "T") return {cls:"c-block-total", badge:"", text:"T"};
      if(code === "P") return {cls:"c-block-parc",  badge:"", text:"P"};
      if(code === "X") return {cls:"c-conflict",    badge:"", text:""};
      if(code.startsWith("D")){
        const n = code.slice(1);
        return {cls:"c-desloc", badge: n ? n : "", text:""};
      }
      const n = parseInt(code,10);
      if(!isNaN(n)) return {cls:"c-event", badge: n>1 ? String(n) : "", text:""};
      return {cls:"c-empty", badge:"", text:""};
    }

    async function loadGrid(ano, mes){
      const res = await fetch(`/mapa-mensal/?ano=${ano}&mes=${mes}`);
      if(!res.ok){ alert("Falha ao buscar dados."); return; }
      const data = await res.json();

      headRow.innerHTML = `<th style="min-width:150px">Formador</th>` + data.dias.map(d=>`<th style="text-align:center;width:16px">${d}</th>`).join('');

      const rows=[];
      for(const linha of data.linhas){
        const cells = linha.celulas.map(code=>{
          const {cls,badge,text} = codeToCell(code);
          return `<td><div class="cell ${cls}">${text||""}${badge?`<span class="badge">${badge}</span>`:""}</div></td>`;
        }).join('');
        rows.push(`<tr><th>${linha.formador}</th>${cells}</tr>`);
      }
      bodyRows.innerHTML = rows.join("");
    }

    const selMes=document.getElementById('selMes');
    const selAno=document.getElementById('selAno');
    const headRow=document.getElementById('headRow');
    const bodyRows=document.getElementById('bodyRows');

    fillSelectors();
    document.getElementById('btnAtualizar').addEventListener('click', ()=>loadGrid(selAno.value, selMes.value));
    loadGrid(selAno.value, selMes.value);
  </script>
</body>
</html>
