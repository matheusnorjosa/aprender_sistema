name: 🔍 Sistema Aprender - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ===== ANÁLISE E QUALIDADE =====
  code-quality:
    name: 📊 Análise de Código
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Cache dependencies  
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        
    - name: 🔧 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort bandit safety
        
    - name: 🎯 Análise de estilo (Black)
      run: black --check --diff .
      continue-on-error: true
      
    - name: 📐 Análise de imports (isort)
      run: isort --check-only --diff .
      continue-on-error: true
      
    - name: 🕵️ Análise de código (Flake8)
      run: flake8 . --max-line-length=88 --extend-ignore=E203,W503
      continue-on-error: true
      
    - name: 🔒 Análise de segurança (Bandit)
      run: bandit -r . -x "/venv/,/tests/,/migrations/" -f json -o bandit-report.json
      continue-on-error: true
      
    - name: 🛡️ Verificação de dependências (Safety)
      run: safety check --json --output safety-report.json
      continue-on-error: true

  # ===== TESTES POR MÓDULO =====
  tests:
    name: 🧪 Testes por Módulo
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        module: [core, planilhas, relatorios, api]
        
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 🔧 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest-django
        
    - name: 🏗️ Setup Django
      run: |
        cp aprender_sistema/settings.py aprender_sistema/settings_test.py
        echo "DATABASES = {'default': {'ENGINE': 'django.db.backends.postgresql', 'NAME': 'test_db', 'USER': 'postgres', 'PASSWORD': 'postgres', 'HOST': 'localhost', 'PORT': '5432'}}" >> aprender_sistema/settings_test.py
        
    - name: 🔄 Executar migrações
      run: python manage.py migrate --settings=aprender_sistema.settings_test
      
    - name: 🧪 Executar testes do módulo ${{ matrix.module }}
      run: |
        coverage run --source='.' manage.py test ${{ matrix.module }} --settings=aprender_sistema.settings_test --verbosity=2
        coverage report --include="${{ matrix.module }}/*"
        coverage xml --include="${{ matrix.module }}/*"
        
    - name: 📊 Upload cobertura
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: ${{ matrix.module }}
        name: coverage-${{ matrix.module }}

  # ===== VALIDAÇÃO DE BRANCHES =====
  branch-validation:
    name: 🌳 Validação de Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: ✅ Validar nome da branch
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        echo "Branch: $BRANCH_NAME"
        
        # Validar padrão de nomenclatura
        if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix|refactor|security)/(core|planilhas|relatorios|api|calendar|controle)-[a-z0-9-]+$ ]]; then
          echo "❌ Nome da branch não segue o padrão: tipo/(módulo)-(descrição)"
          echo "Exemplo: feature/planilhas-nova-importacao"
          exit 1
        fi
        
        echo "✅ Nome da branch válido!"

  # ===== DEPLOY PARA HOMOLOGAÇÃO =====
  deploy-homolog:
    name: 🚀 Deploy Homologação
    runs-on: ubuntu-latest
    needs: [code-quality, tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy para ambiente de homologação  
      run: |
        echo "🔄 Iniciando deploy para homologação..."
        # Aqui seria integrado com Render, Railway, etc.
        echo "✅ Deploy concluído!"

  # ===== NOTIFICAÇÕES =====
  notify:
    name: 📢 Notificações
    runs-on: ubuntu-latest
    needs: [code-quality, tests, branch-validation]
    if: always()
    
    steps:
    - name: 📊 Status da Pipeline
      run: |
        if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.tests.result }}" == "success" ]]; then
          echo "✅ Pipeline executada com sucesso!"
        else
          echo "❌ Pipeline falhou. Verifique os logs."
        fi