# ======================================
# 🛠️ DOCKER COMPOSE - DESENVOLVIMENTO
# Sistema Aprender
# ======================================

version: '3.8'

services:
  # ==========================================
  # DATABASE - POSTGRESQL
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: aprender_db_dev
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=aprender_sistema_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/dev/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    ports:
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aprender_sistema_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - aprender_network

  # ==========================================
  # WEB APPLICATION - DJANGO
  # ==========================================
  web:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: aprender_web_dev
    restart: unless-stopped
    
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/aprender_sistema_dev
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # Google integrations (optional for development)
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON:-}
      - GOOGLE_CALENDAR_TIME_ZONE=America/Fortaleza
      # Email (optional for development)
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      # Cache
      - CACHE_BACKEND=locmem
    
    volumes:
      - .:/app:cached
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
      - logs_volume_dev:/app/logs
    
    ports:
      - "8000:8000"
    
    depends_on:
      db:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - aprender_network

  # ==========================================
  # REDIS - CACHE & SESSION STORE (Optional)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: aprender_redis_dev
    restart: unless-stopped
    
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis_data_dev:/data
    
    ports:
      - "6379:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - aprender_network

  # ==========================================
  # MAILHOG - EMAIL TESTING (Development)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aprender_mailhog_dev
    restart: unless-stopped
    
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web interface
    
    networks:
      - aprender_network

  # ==========================================
  # ADMINER - DATABASE MANAGEMENT
  # ==========================================
  adminer:
    image: adminer:4-standalone
    container_name: aprender_adminer_dev
    restart: unless-stopped
    
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DESIGN=flat
    
    ports:
      - "8080:8080"
    
    depends_on:
      - db
    
    networks:
      - aprender_network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data_dev:
    driver: local
    name: aprender_postgres_dev
  
  static_volume_dev:
    driver: local
    name: aprender_static_dev
  
  media_volume_dev:
    driver: local
    name: aprender_media_dev
  
  logs_volume_dev:
    driver: local
    name: aprender_logs_dev
  
  redis_data_dev:
    driver: local
    name: aprender_redis_dev

# ==========================================
# NETWORKS
# ==========================================
networks:
  aprender_network:
    driver: bridge
    name: aprender_dev_network