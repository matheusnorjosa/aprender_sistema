# 🤖 Dependabot Configuration - Sistema Aprender
# Automatically keep dependencies up to date
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ================================
  # PYTHON DEPENDENCIES
  # ================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Fortaleza"
    
    # Dependency categories
    groups:
      # Django and core framework updates
      django-ecosystem:
        patterns:
          - "Django*"
          - "django*"
          - "djangorestframework*"
          - "Pillow"
        update-types:
          - "minor"
          - "patch"
      
      # Database and ORM
      database:
        patterns:
          - "psycopg*"
          - "dj-database-url"
          - "sqlparse"
        update-types:
          - "minor"
          - "patch"
      
      # Development and testing tools
      dev-tools:
        patterns:
          - "pytest*"
          - "coverage"
          - "black"
          - "flake8*"
          - "isort"
          - "pre-commit"
          - "bandit*"
        update-types:
          - "minor"
          - "patch"
      
      # Google integrations
      google-apis:
        patterns:
          - "google*"
          - "oauth2client"
          - "httplib2"
        update-types:
          - "minor"
          - "patch"

    # PR configuration
    open-pull-requests-limit: 10
    
    # Commit message prefix
    commit-message:
      prefix: "deps"
      prefix-development: "dev-deps"
    
    # Labels for categorization  
    labels:
      - "dependencies"
      - "automated"
      - "low-priority"
    
    # Reviewers (optional)
    reviewers:
      - "matheusnorjosa"
    
    # Only security updates for major versions
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ================================  
  # DOCKER DEPENDENCIES
  # ================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first-tuesday"
      time: "10:00"
      timezone: "America/Fortaleza"
    
    # Group Docker updates
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    
    open-pull-requests-limit: 5
    
    commit-message:
      prefix: "docker"
    
    labels:
      - "docker"
      - "infrastructure"
      - "automated"

  # ================================
  # GITHUB ACTIONS
  # ================================
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      day: "first-wednesday"  
      time: "11:00"
      timezone: "America/Fortaleza"
    
    # Group action updates
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    
    open-pull-requests-limit: 5
    
    commit-message:
      prefix: "ci"
    
    labels:
      - "github-actions"
      - "ci-cd"
      - "automated"

# ================================
# SECURITY AND VULNERABILITY UPDATES  
# ================================
# Note: Dependabot automatically creates PRs for security vulnerabilities
# regardless of the schedule configuration above.
#
# Security updates will have:
# - Priority: HIGH
# - Labels: ["security", "automated"]  
# - Auto-merge: Enabled for patch-level security fixes
#
# For critical security updates:
# 1. PR will be created immediately
# 2. Multiple reviewers will be assigned
# 3. Slack notification (if configured)