name: frontend-ci

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'v2/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, feat/dashboard-compras-etl ]
    # Removed path filters for pull_request to ensure required check always runs
    # This is needed because the ruleset requires "frontend-ci" as a status check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-doctor:
    name: react doctor quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: v2/frontend

    - name: Run React Doctor quality gate
      run: node v2/scripts/react-doctor-gate.mjs v2/frontend
      env:
        REACT_DOCTOR_MIN_SCORE: '75'

  build-lint-frontend:
    name: build/lint do frontend
    runs-on: ubuntu-latest
    needs: react-doctor
    timeout-minutes: 20

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build with Vite
      run: npm run build

    - name: Run tests
      run: npm run test

    - name: Check bundle sizes
      run: npm run size

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: v2/frontend/dist
        retention-days: 1

  checklist-tests:
    name: checklist tests (meta, a11y, security)
    runs-on: ubuntu-latest
    needs: build-lint-frontend
    timeout-minutes: 25

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps

    - name: Run checklist tests
      run: npm run test:checklist
      env:
        # PR CI does not run behind production-grade reverse proxy headers.
        # Keep strict header assertions opt-in via STRICT_SECURITY_HEADERS=1.
        STRICT_SECURITY_HEADERS: '0'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checklist-test-results
        path: v2/frontend/test-results
        retention-days: 7

  lighthouse-ci:
    name: lighthouse CI
    runs-on: ubuntu-latest
    needs: build-lint-frontend
    if: github.event_name == 'pull_request'
    timeout-minutes: 12

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: v2/frontend/dist

    - name: Run Lighthouse CI
      run: npm run lighthouse:ci
      # Informational-only until fixed CI budgets are agreed for this repository.
      continue-on-error: true

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-results
        path: v2/frontend/.lighthouseci
        retention-days: 7
