name: CI – Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, feat/dashboard-compras-etl ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------
  # Job 1: Lint (rápido, ~1min)
  # Migrado de v2-ci.yml após remoção
  # ----------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install black isort flake8

      - name: Lint with Black
        run: |
          cd v2/backend
          black --check --diff .

      - name: Lint with isort
        run: |
          cd v2/backend
          isort --check-only --diff .

      - name: Lint with Flake8
        run: |
          cd v2/backend
          flake8 apps/ config/

  # ----------------------------------------------------------------
  # Job 2: Backend tests on runner (~10min)
  # Runs in parallel with lint (no dependency)
  # ----------------------------------------------------------------
  backend-tests:
    name: backend tests (runner)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          v2/backend/requirements.txt
          v2/backend/requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r v2/backend/requirements.txt
        pip install -r v2/backend/requirements-dev.txt
        pip install pytest pytest-django pytest-cov pytest-xdist

    - name: Set up environment variables
      run: |
        echo "DJANGO_SETTINGS_MODULE=config.settings" >> $GITHUB_ENV
        echo "ENVIRONMENT=testing" >> $GITHUB_ENV
        echo "DEBUG=0" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DB_NAME=test_aprender" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "REDIS_HOST=localhost" >> $GITHUB_ENV
        echo "REDIS_PORT=6379" >> $GITHUB_ENV
        echo "TZ=America/Fortaleza" >> $GITHUB_ENV
        echo "REQUIRE_DOCKER=0" >> $GITHUB_ENV
        echo "GCAL_CLIENT=fake" >> $GITHUB_ENV
        echo "GCAL_SEND_UPDATES=none" >> $GITHUB_ENV
        echo "FEATURE_AUTO_APPLY_ENABLED=false" >> $GITHUB_ENV
        echo "ETL_OUTPUT_DIR=${{ github.workspace }}/v2/backend/out_etl" >> $GITHUB_ENV
        echo "ETL_DATA_DIR=${{ github.workspace }}/v2/backend/data/csv-import" >> $GITHUB_ENV
        echo "PYTHONDONTWRITEBYTECODE=1" >> $GITHUB_ENV

    - name: Type check with Pyright
      run: |
        cd v2/backend
        pyright apps/core apps/dat_ingest config
      continue-on-error: false

    - name: Validate test paths (no /app hardcoded)
      run: |
        cd v2/backend
        if grep -R --line-number '"/app' apps/core/tests apps/dat_ingest/tests 2>/dev/null | grep -v "Binary file" | grep -v '"/api/'; then
          echo "❌ Found '/app' hardcoded in tests. Use Path(settings.BASE_DIR) instead." >&2
          exit 1
        fi
        echo "✅ No hardcoded '/app' paths found in tests"

    - name: Run migrations
      run: |
        cd v2/backend
        python manage.py migrate --noinput

    - name: Prepare runtime dirs and symlinks
      run: |
        sudo mkdir -p /app
        # garantir diretórios no workspace
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/.agents/outbox"
        # apontar /app/.agents -> workspace/.agents
        sudo rm -rf /app/.agents || true
        sudo ln -s "$GITHUB_WORKSPACE/v2/backend/.agents" /app/.agents
        # opcional: ETL dirs também
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/out_etl"
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/data/csv-import"

    - name: Run tests with coverage
      run: |
        cd v2/backend
        # Full test suite for both PRs and main branch
        # This ensures no regressions slip through to main
        echo "🧪 Running full test suite"
        pytest -q --tb=short --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./v2/backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ----------------------------------------------------------------
  # Job 3: Docker parity (backend)
  #
  # Trade-off:
  # - Adds a complementary gate to catch "passes on runner, fails in container".
  # - Increases CI duration by a few minutes.
  #
  # Optimizations:
  # - Uses only smoke checks (lint subset + critical tests subset).
  # - Reuses Actions service containers (Postgres/Redis) instead of full compose stack.
  # ----------------------------------------------------------------
  docker-parity-backend:
    name: docker parity (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Build backend image (official Dockerfile)
      run: |
        docker build -f v2/infra/Dockerfile -t aprender-backend:ci-parity-${{ github.sha }} v2

    - name: Run smoke checks inside container
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        ENVIRONMENT: testing
        DEBUG: "0"
        SECRET_KEY: test-secret-key-for-ci-only
        DB_HOST: host.docker.internal
        DB_PORT: "5432"
        DB_NAME: test_aprender
        DB_USER: postgres
        DB_PASSWORD: postgres
        REDIS_HOST: host.docker.internal
        REDIS_PORT: "6379"
        TZ: America/Fortaleza
        REQUIRE_DOCKER: "1"
        GCAL_CLIENT: fake
        GCAL_SEND_UPDATES: none
      run: |
        docker run --rm --add-host host.docker.internal:host-gateway \
          -e DJANGO_SETTINGS_MODULE \
          -e ENVIRONMENT \
          -e DEBUG \
          -e SECRET_KEY \
          -e DB_HOST \
          -e DB_PORT \
          -e DB_NAME \
          -e DB_USER \
          -e DB_PASSWORD \
          -e REDIS_HOST \
          -e REDIS_PORT \
          -e TZ \
          -e REQUIRE_DOCKER \
          -e GCAL_CLIENT \
          -e GCAL_SEND_UPDATES \
          aprender-backend:ci-parity-${{ github.sha }} \
          bash -lc '
            set -euo pipefail
            pip install --no-cache-dir pytest pytest-django black isort flake8
            black --check apps/core/auth_backends.py apps/core/models/__init__.py
            isort --check-only apps/core/auth_backends.py
            flake8 apps/core/auth_backends.py
            python manage.py migrate --noinput
            pytest -q --tb=short \
              apps/core/tests/test_modular_imports.py \
              apps/core/tests/test_auth_backends.py
          '

  # ----------------------------------------------------------------
  # Job 4: Required backend gate
  # Keeps the required "tests" check in ruleset while aggregating
  # runner tests + docker parity.
  # ----------------------------------------------------------------
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - docker-parity-backend
    if: always()
    timeout-minutes: 5
    steps:
    - name: Assert backend gates passed
      run: |
        if [ "${{ needs.backend-tests.result }}" != "success" ]; then
          echo "backend-tests failed with result=${{ needs.backend-tests.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.docker-parity-backend.result }}" != "success" ]; then
          echo "docker-parity-backend failed with result=${{ needs.docker-parity-backend.result }}" >&2
          exit 1
        fi
        echo "Backend runner tests + Docker parity passed."
