# ======================================
# 🚀 DOCKER COMPOSE - PRODUÇÃO
# Sistema Aprender
# ======================================

version: '3.8'

services:
  # ==========================================
  # DATABASE - POSTGRESQL
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: aprender_db_prod
    restart: always
    
    environment:
      - POSTGRES_DB=${DB_NAME:-aprender_sistema}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Database password required}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups:rw
    
    # Don't expose port in production for security
    expose:
      - "5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aprender_sistema}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - aprender_network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.5'

  # ==========================================
  # WEB APPLICATION - DJANGO + NGINX
  # ==========================================
  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: production
    container_name: aprender_web_prod
    restart: always
    
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?Secret key required}
      - DATABASE_URL=${DATABASE_URL:?Database URL required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Allowed hosts required}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:?CSRF trusted origins required}
      
      # Google Integrations
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:?Google Calendar ID required}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON:?Google credentials required}
      - GOOGLE_CALENDAR_TIME_ZONE=${GOOGLE_CALENDAR_TIME_ZONE:-America/Fortaleza}
      
      # Email Configuration
      - EMAIL_HOST=${EMAIL_HOST:?Email host required}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:?Email user required}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:?Email password required}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@aprender.com}
      
      # Cache & Sessions
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/1
      - SESSION_ENGINE=django.contrib.sessions.backends.cached_db
      
      # Security
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-false}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-false}
      
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN:-}
    
    volumes:
      - static_volume_prod:/app/staticfiles:ro
      - media_volume_prod:/app/media
      - logs_volume_prod:/app/logs
    
    ports:
      - "80:80"
      - "443:443"
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    
    networks:
      - aprender_network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '1.0'

  # ==========================================
  # REDIS - CACHE & SESSIONS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: aprender_redis_prod
    restart: always
    
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 60
      --tcp-keepalive 60
      --save 900 1
      --save 300 10
      --save 60 10000
    
    volumes:
      - redis_data_prod:/data
    
    expose:
      - "6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - aprender_network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.3'

  # ==========================================
  # BACKUP AUTOMATION
  # ==========================================
  backup:
    image: postgres:15-alpine
    container_name: aprender_backup_prod
    restart: "no"
    
    environment:
      - PGPASSWORD=${DB_PASSWORD:?Database password required}
    
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    
    command: /bin/sh /backup.sh
    
    depends_on:
      - db
    
    networks:
      - aprender_network
    
    # Run backup daily via cron or external scheduler
    profiles:
      - backup

  # ==========================================
  # MONITORING - WATCHTOWER (Auto-updates)
  # ==========================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: aprender_watchtower
    restart: always
    
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    
    networks:
      - aprender_network
    
    # Only update specific services
    command: aprender_web_prod
    
    profiles:
      - monitoring

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data_prod:
    driver: local
    name: aprender_postgres_prod
  
  static_volume_prod:
    driver: local
    name: aprender_static_prod
  
  media_volume_prod:
    driver: local
    name: aprender_media_prod
  
  logs_volume_prod:
    driver: local
    name: aprender_logs_prod
  
  redis_data_prod:
    driver: local
    name: aprender_redis_prod

# ==========================================
# NETWORKS
# ==========================================
networks:
  aprender_network:
    driver: bridge
    name: aprender_prod_network
    ipam:
      config:
        - subnet: 172.20.0.0/16