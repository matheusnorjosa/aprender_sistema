name: Backend xdist Canary (non-blocking)

on:
  schedule:
    # Mensal (dia 1, 10:20 UTC); era diario, depois semanal. Corte de custo de Actions (2026-09).
    # O que ele mede de fato: `pytest apps` inteiro num banco MIGRADO (o gate do PR roda
    # --no-migrations). O `push` abaixo so dispara quando os arquivos do proprio canary mudam;
    # codigo novo que quebra na suite migrada so aparece aqui, no run mensal.
    - cron: "20 10 1 * *"
  workflow_dispatch:
    inputs:
      extra_pytest_args:
        description: "Optional extra pytest args (example: -k test_config_validation)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/backend-xdist-canary.yml"
      - ".github/workflows/_backend-test.yml"
      - "v2/scripts/xdist_canary_report.py"
      - "docs/operations/ci-backend-xdist-canary.md"
      - "docs/operations/ci-backend-xdist-stabilization-backlog.md"
      - "docs/operations/ci-check-policy.md"

permissions:
  # `issues: write` movido p/ o job canary-report (unico que comenta na issue);
  # o job de matriz de testes herda so `contents: read`. #1397.
  contents: read

concurrency:
  # Run filtrado (extra_pytest_args) tem grupo proprio: conferir um conserto com `-k` nao cancela o run oficial.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.extra_pytest_args || 'oficial' }}
  cancel-in-progress: true

jobs:
  xdist-canary:
    name: "[info] backend xdist canary (w=${{ matrix.workers }},dist=${{ matrix.dist }})"
    strategy:
      fail-fast: false
      matrix:
        workers: ["2", "auto"]
        dist: ["loadscope", "loadfile"]
    # Setup (services/env/migrate/dirs) centralizado no reusable; matrix fica aqui no
    # caller e passa workers/dist via inputs. #1401.
    uses: ./.github/workflows/_backend-test.yml
    with:
      runner_timeout: 40
      pytest_paths: apps
      pytest_extra_args: >-
        -n ${{ matrix.workers }} --dist ${{ matrix.dist }} --max-worker-restart=0
        --junitxml=xdist-canary-junit.xml ${{ github.event.inputs.extra_pytest_args || '' }}
      summary_title: xdist canary run
      capture_log_file: xdist-canary-pytest.log
      # non-blocking na celula: o exit real vai para o metadata, e quem fica vermelho e o
      # canary-report (issue do canary, marcador as-xdist-canary). #1401.
      fail_on_test_error: false
      emit_canary_metadata: true
      matrix_workers: ${{ matrix.workers }}
      matrix_dist: ${{ matrix.dist }}
      artifact_name: xdist-canary-${{ matrix.workers }}w-${{ matrix.dist }}
      artifact_paths: |
        v2/backend/xdist-canary-pytest.log
        v2/backend/xdist-canary-junit.xml
        v2/backend/xdist-canary-metadata.json
      artifact_if_no_files: warn
      artifact_retention_days: 30

  canary-report:
    name: "[ops] backend xdist canary summary"
    runs-on: ubuntu-latest
    permissions:
      # Unico job que mexe na issue do canary — issues:write vive aqui. #1397.
      contents: read
      issues: write
    needs:
      - xdist-canary
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Download xdist canary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # So as celulas (xdist-canary-<w>w-<dist>). `xdist-canary-*` tambem casaria o
          # xdist-canary-report de uma tentativa anterior, e ele contaria como 5a celula.
          pattern: xdist-canary-*w-*
          path: xdist-canary-artifacts
          digest-mismatch: warn

      # O script decide o alerta (estado/acao no JSON) e tem teste:
      # v2/backend/apps/core/tests/test_xdist_canary_report.py.
      # --expected-cells = celulas da matriz acima (2 workers x 2 dist). Mudou a matriz? Mude
      # aqui; se esquecer, o run vira "nao mediu" (vermelho), nunca "limpo".
      - name: Build consolidated canary report
        if: ${{ !cancelled() }}
        env:
          CANARY_REF: ${{ github.ref }}
          EXTRA_PYTEST_ARGS: ${{ github.event.inputs.extra_pytest_args || '' }}
        run: |
          python v2/scripts/xdist_canary_report.py \
            --artifacts-dir xdist-canary-artifacts \
            --output-json xdist-canary-report.json \
            --output-md xdist-canary-report.md \
            --ref="$CANARY_REF" \
            --extra-pytest-args="$EXTRA_PYTEST_ARGS" \
            --expected-cells=4

      - name: Upload consolidated report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xdist-canary-report
          path: |
            xdist-canary-report.json
            xdist-canary-report.md
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          if [ -f xdist-canary-report.md ]; then
            cat xdist-canary-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "xdist-canary-report.md not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Destino do alerta: UMA issue ABERTA, criada pelo github-actions[bot], com o marcador
      # abaixo. Antes ia para a #677, fechada desde 2026-04-23: 16 runs vermelhos seguidos
      # (02/07 a 28/09) comentaram la e ninguem viu. Issue aberta = canary vermelho.
      # Acao (decidida pelo script, ver acima):
      #   fechar             -> run COMPLETO E LIMPO da main sem filtro: comenta e fecha
      #   abrir_ou_comentar  -> falha ou "nao mediu" num run oficial (main, sem filtro)
      #   so_resumo          -> run nao oficial (outro ref ou extra_pytest_args): so o summary;
      #                         nunca toca na issue da main (verde se limpo, vermelho se nao)
      # Filtro por autor: o repo e publico e qualquer um abre issue com o marcador.
      # Sem continue-on-error, e todo estado diferente de "limpo" sai vermelho: o GitHub
      # manda o e-mail de falha, e alerta nao entregue nao passa em silencio.
      - name: Entregar alerta na issue do canary
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- as-xdist-canary -->"
        run: |
          set -euo pipefail
          if [ ! -f xdist-canary-report.json ]; then
            echo "::error::xdist-canary-report.json ausente: o relatorio nao foi gerado, entao este run nao mediu nada."
            exit 1
          fi
          ESTADO=$(jq -r '.alerta.estado' xdist-canary-report.json)
          ACAO=$(jq -r '.alerta.acao' xdist-canary-report.json)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and ((.body // "") | contains(env.MARKER))) | .number' \
            | sort -n | sed -n '1p')
          { echo "Run: ${RUN_URL}"; echo; cat xdist-canary-report.md; } > "$RUNNER_TEMP/alerta.md"

          case "$ACAO" in
            fechar)
              if [ -n "$ISSUE" ]; then
                gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                  --comment "Run completo e limpo (main, sem filtro, todas as celulas): ${RUN_URL}. Fechando; a proxima falha abre outra."
                echo "Canary limpo; #${ISSUE} fechada." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Canary limpo; nenhuma issue aberta." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            so_resumo)
              echo "Run nao oficial (${ESTADO}): resultado so neste summary; a issue da main nao e tocada." >> "$GITHUB_STEP_SUMMARY"
              cat xdist-canary-report.md >> "$GITHUB_STEP_SUMMARY"
              ;;
            abrir_ou_comentar)
              if [ -n "$ISSUE" ]; then
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/alerta.md"
                echo "Alerta (${ESTADO}) entregue na #${ISSUE}." >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "$MARKER"
                  echo "Aberta pelo backend-xdist-canary.yml. O canary roda pytest apps inteiro num banco MIGRADO;"
                  echo "o gate do PR roda --no-migrations, entao uma falha aqui pode nao aparecer em PR nenhum."
                  echo "Cada run oficial com falha (ou que nao mediu) comenta aqui; o primeiro run completo e limpo da main fecha a issue."
                  echo
                  cat "$RUNNER_TEMP/alerta.md"
                } > "$RUNNER_TEMP/issue.md"
                URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "Canary do backend vermelho: suite inteira em banco migrado" \
                  --label ci --label tests --body-file "$RUNNER_TEMP/issue.md")
                echo "Alerta (${ESTADO}) entregue em ${URL} (issue nova)." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "::error::acao desconhecida no relatorio: '${ACAO}'."
              exit 1
              ;;
          esac

          if [ "$ESTADO" != "limpo" ]; then
            echo "::error::Canary ${ESTADO}: ver o summary e a issue do canary (marcador as-xdist-canary)."
            exit 1
          fi
