name: frontend-ci

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'v2/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    # Removed path filters for pull_request to ensure required check always runs
    # This is needed because the ruleset requires "frontend-ci" as a status check

jobs:
  build/lint do frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build with Vite
      run: npm run build

    - name: Run tests (optional)
      run: npm run test
      continue-on-error: true
