name: Dependency Review & Scorecard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: "[required] dependency review"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: deps-changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --prune --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$CHANGED_FILES"

          PYTHON_CHANGED=false
          FRONTEND_CHANGED=false

          if echo "$CHANGED_FILES" | grep -Eq '^v2/backend/requirements.*\.txt$'; then
            PYTHON_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -Eq '^v2/frontend/(package\.json|package-lock\.json)$'; then
            FRONTEND_CHANGED=true
          fi

          if [ "$PYTHON_CHANGED" = true ] || [ "$FRONTEND_CHANGED" = true ]; then
            ANY_CHANGED=true
          else
            ANY_CHANGED=false
          fi

          echo "python_changed=$PYTHON_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "any_changed=$ANY_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Dependency Review (public repos, block HIGH/CRITICAL)
        if: github.event.repository.private == false && steps.deps-changes.outputs.any_changed == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

      # Private repositories without GHAS can not use dependency-review-action.
      # Fallback keeps a blocking dependency gate for changed dependency manifests.
      - name: Fallback Python dependency scan (private repos)
        if: github.event.repository.private == true && steps.deps-changes.outputs.python_changed == 'true'
        uses: aquasecurity/trivy-action@476e4fdcdc675b65ce75e8c3440b48d7a494f0e5 # 0.34.1
        with:
          scan-type: fs
          scan-ref: v2/backend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Setup Node.js with deps (fallback frontend scan)
        if: github.event.repository.private == true && steps.deps-changes.outputs.frontend_changed == 'true'
        uses: ./.github/actions/setup-node-deps

      - name: Fallback Frontend dependency scan (private repos)
        if: github.event.repository.private == true && steps.deps-changes.outputs.frontend_changed == 'true'
        run: |
          set -euo pipefail
          cd v2/frontend
          npm audit --omit=dev --audit-level=high

      - name: Dependency gate summary
        if: always()
        run: |
          echo "dependency manifests changed: ${{ steps.deps-changes.outputs.any_changed }}"
          echo "python changed: ${{ steps.deps-changes.outputs.python_changed }}"
          echo "frontend changed: ${{ steps.deps-changes.outputs.frontend_changed }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Private repository: fallback dependency gate applied."
          else
            echo "Public repository: dependency-review-action applied."
          fi

  scorecard:
    name: "[info] openssf scorecard"
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    # Fork PRs can have restricted token permissions for Scorecard internals.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: openssf-scorecard-results
          path: scorecard-results.sarif
          retention-days: 14
