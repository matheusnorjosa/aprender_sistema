name: Strict Security Headers

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL alvo (opcional). Vazio = producao (DEFAULT_BASE_URL deste arquivo).'
        required: false
        type: string
  schedule:
    # Run daily at 03:00 UTC
    # Reduzido diário→semanal (segunda) — headers de segurança mudam raramente. Corte de
    # custo de Actions (2026-09). Mede a PRODUCAO; sem alvo, falha (nao pula).
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-security-headers:
    name: "[ops] strict security headers (staging/prod)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Producao, escrita aqui de proposito (e nao em vars/secrets): a variavel de repo
      # nunca existiu e o agendamento pulava verde. A URL e publica (o mesmo host esta em
      # v2/backend/config/settings.py, _CORS_PROD_DEFAULTS). Mudou o dominio? Mude aqui.
      DEFAULT_BASE_URL: https://aprendersistema.com.br

    defaults:
      run:
        working-directory: v2/frontend

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

    - name: Resolve target URL
      id: target
      env:
        INPUT_BASE_URL: ${{ github.event.inputs.base_url || '' }}
      run: |
        set -euo pipefail
        TARGET_URL="${INPUT_BASE_URL:-$DEFAULT_BASE_URL}"
        # Nao poder medir nao e aprovar. Antes, sem vars/secrets, o agendamento pulava e saia
        # verde: 8 semanas de "success" sem medir nada, enquanto a producao estava sem
        # headers de seguranca (M27-24). Sem alvo agora e erro, em qualquer evento.
        if [ -z "$TARGET_URL" ]; then
          echo "::error::Sem URL alvo: DEFAULT_BASE_URL vazio e nenhum input base_url."
          exit 1
        fi
        ORIGEM="default do workflow"
        if [ -n "$INPUT_BASE_URL" ]; then ORIGEM="input do dispatch"; fi
        # Sem add-mask: a URL e publica, e mascara-la so impedia o summary de dizer o que mediu.
        echo "Alvo: ${TARGET_URL} (${ORIGEM})" >> "$GITHUB_STEP_SUMMARY"
        echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js 22.x
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'v2/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    # Sem --with-deps, como no frontend-ci: o ubuntu-latest ja tem as libs, e o apt do
    # mirror era fonte de flake.
    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Run strict security headers spec
      run: npx playwright test e2e/checklist/security-headers.spec.ts --project=checklist
      env:
        SKIP_WEBSERVER: '1'
        BASE_URL: ${{ steps.target.outputs.target_url }}
        PRODUCTION_URL: ${{ steps.target.outputs.target_url }}
        STRICT_SECURITY_HEADERS: '1'

    - name: Upload strict security headers artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      if: always()
      with:
        name: strict-security-headers-results
        path: |
          v2/frontend/test-results
          v2/frontend/playwright-report
        retention-days: 14
