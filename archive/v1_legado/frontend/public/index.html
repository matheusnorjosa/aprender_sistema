<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema Aprender - Gestão de Solicitações e Eventos"
    />
    <title>Sistema Aprender</title>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
        if (window.caches) { caches.keys().then(k => k.forEach(c => caches.delete(c))); }
      }
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para rodar esta aplicação.</noscript>
    <div id="root"></div>
  </body>
</html>
