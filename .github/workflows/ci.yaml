name: CI – Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, feat/dashboard-compras-etl ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------
  # Job 0: Backend impact detector
  #
  # Goal:
  # - Avoid full backend suite on PRs that do not touch backend-critical files.
  # - Keep non-PR events in safe full mode.
  # ----------------------------------------------------------------
  backend-impact:
    name: "[required] backend impact"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
      backend_changed_count: ${{ steps.detect.outputs.backend_changed_count }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect backend impact
      id: detect
      run: |
        set -euo pipefail

        # Safety-first policy:
        # - PR: allow skip of backend-heavy jobs when no backend impact is detected.
        # - push/workflow_dispatch/other events: keep full backend gates enabled.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          echo "changed_files_count=0" >> "$GITHUB_OUTPUT"
          echo "backend_changed_count=0" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend Impact Detection"
            echo "- Event: ${{ github.event_name }}"
            echo "- Decision: backend_changed=true"
            echo "- Reason: non-PR event (safe full mode)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"

        if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          echo "changed_files_count=0" >> "$GITHUB_OUTPUT"
          echo "backend_changed_count=0" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend Impact Detection"
            echo "- Event: pull_request"
            echo "- Decision: backend_changed=true"
            echo "- Reason: missing PR base/head SHA (safe fallback)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
        CHANGED_COUNT="$(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

        # Conservative impact patterns to prevent false green:
        # includes backend app, backend runtime infra, backend tests and this CI workflow itself.
        BACKEND_IMPACT_REGEX='^(v2/backend/|v2/infra/|v2/tests/|v2/.dockerignore$|\.github/workflows/ci\.yaml$)'
        BACKEND_MATCHED_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E "$BACKEND_IMPACT_REGEX" || true)"
        BACKEND_MATCHED_COUNT="$(printf '%s\n' "$BACKEND_MATCHED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

        BACKEND_CHANGED="false"
        if [ "$BACKEND_MATCHED_COUNT" -gt 0 ]; then
          BACKEND_CHANGED="true"
        fi

        echo "backend_changed=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
        echo "changed_files_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
        echo "backend_changed_count=$BACKEND_MATCHED_COUNT" >> "$GITHUB_OUTPUT"

        {
          echo "### Backend Impact Detection"
          echo "- Event: pull_request"
          echo "- Base SHA: $BASE_SHA"
          echo "- Head SHA: $HEAD_SHA"
          echo "- Changed files: $CHANGED_COUNT"
          echo "- Backend impact files: $BACKEND_MATCHED_COUNT"
          echo "- Decision: backend_changed=$BACKEND_CHANGED"
          if [ -n "$BACKEND_MATCHED_FILES" ]; then
            echo "- Matched files:"
            printf '%s\n' "$BACKEND_MATCHED_FILES" | sed 's/^/  - /'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------
  # Job 1: Lint (rápido, ~1min)
  # Migrado de v2-ci.yml após remoção
  # ----------------------------------------------------------------
  lint:
    name: "[required] lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install black isort flake8

      - name: Lint with Black
        run: |
          cd v2/backend
          black --check --diff .

      - name: Lint with isort
        run: |
          cd v2/backend
          isort --check-only --diff .

      - name: Lint with Flake8
        run: |
          cd v2/backend
          flake8 apps/ config/

  # ----------------------------------------------------------------
  # Job 2: Backend tests on runner (~10min)
  # Runs in parallel with lint (no dependency)
  # ----------------------------------------------------------------
  backend-tests:
    name: "[required] backend tests (runner)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    env:
      # Controlled experiment (Issue #649): keep disabled by default after
      # instability observed with full parallel run. Re-enable when targeted
      # test groups are proven xdist-safe.
      PYTEST_XDIST_ENABLED: '0'
      PYTEST_XDIST_WORKERS: 'auto'
      PYTEST_XDIST_DIST: 'loadscope'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          v2/backend/requirements.txt
          v2/backend/requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r v2/backend/requirements.txt
        pip install -r v2/backend/requirements-dev.txt

    - name: Set up environment variables
      run: |
        echo "DJANGO_SETTINGS_MODULE=config.settings" >> $GITHUB_ENV
        echo "ENVIRONMENT=testing" >> $GITHUB_ENV
        echo "DEBUG=0" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DB_NAME=test_aprender" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "REDIS_HOST=localhost" >> $GITHUB_ENV
        echo "REDIS_PORT=6379" >> $GITHUB_ENV
        echo "TZ=America/Fortaleza" >> $GITHUB_ENV
        echo "REQUIRE_DOCKER=0" >> $GITHUB_ENV
        echo "GCAL_CLIENT=fake" >> $GITHUB_ENV
        echo "GCAL_SEND_UPDATES=none" >> $GITHUB_ENV
        echo "FEATURE_AUTO_APPLY_ENABLED=false" >> $GITHUB_ENV
        echo "ETL_OUTPUT_DIR=${{ github.workspace }}/v2/backend/out_etl" >> $GITHUB_ENV
        echo "ETL_DATA_DIR=${{ github.workspace }}/v2/backend/data/csv-import" >> $GITHUB_ENV
        echo "PYTHONDONTWRITEBYTECODE=1" >> $GITHUB_ENV

    - name: Validate test paths (no /app hardcoded)
      run: |
        cd v2/backend
        if grep -R --line-number '"/app' apps/core/tests apps/dat_ingest/tests 2>/dev/null | grep -v "Binary file" | grep -v '"/api/'; then
          echo "❌ Found '/app' hardcoded in tests. Use Path(settings.BASE_DIR) instead." >&2
          exit 1
        fi
        echo "✅ No hardcoded '/app' paths found in tests"

    - name: Run migrations
      run: |
        cd v2/backend
        python manage.py migrate --noinput

    - name: Prepare runtime dirs and symlinks
      run: |
        sudo mkdir -p /app
        # garantir diretórios no workspace
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/.agents/outbox"
        # apontar /app/.agents -> workspace/.agents
        sudo rm -rf /app/.agents || true
        sudo ln -s "$GITHUB_WORKSPACE/v2/backend/.agents" /app/.agents
        # opcional: ETL dirs também
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/out_etl"
        mkdir -p "$GITHUB_WORKSPACE/v2/backend/data/csv-import"

    - name: Run tests with coverage
      run: |
        cd v2/backend
        # Full test suite for both PRs and main branch.
        # Controlled xdist experiment can be disabled quickly via PYTEST_XDIST_ENABLED=0.
        MODE="serial"
        PYTEST_EXTRA_ARGS=""
        if [ "${PYTEST_XDIST_ENABLED}" = "1" ]; then
          MODE="xdist"
          PYTEST_EXTRA_ARGS="-n ${PYTEST_XDIST_WORKERS} --dist ${PYTEST_XDIST_DIST}"
        fi

        echo "🧪 Running full test suite (mode=${MODE})"
        START_TS=$(date +%s)

        set +e
        pytest -q --tb=short ${PYTEST_EXTRA_ARGS} --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=80
        TEST_EXIT=$?
        set -e

        END_TS=$(date +%s)
        DURATION_SEC=$((END_TS - START_TS))
        {
          echo "### Backend Tests Runtime"
          echo "- Mode: ${MODE}"
          if [ "${MODE}" = "xdist" ]; then
            echo "- Workers: ${PYTEST_XDIST_WORKERS}"
            echo "- Dist strategy: ${PYTEST_XDIST_DIST}"
          fi
          echo "- Duration (seconds): ${DURATION_SEC}"
          echo "- Rollback: set \`PYTEST_XDIST_ENABLED=0\` in \`.github/workflows/ci.yaml\`"
          echo "- Exit code: ${TEST_EXIT}"
        } >> "${GITHUB_STEP_SUMMARY}"

        exit ${TEST_EXIT}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./v2/backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ----------------------------------------------------------------
  # Job 3: Backend typecheck with Pyright
  # Runs in parallel to keep typecheck out of backend test critical path.
  # ----------------------------------------------------------------
  backend-typecheck:
    name: "[required] backend typecheck (pyright)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          v2/backend/requirements.txt
          v2/backend/requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r v2/backend/requirements.txt
        pip install -r v2/backend/requirements-dev.txt

    - name: Type check with Pyright
      run: |
        cd v2/backend
        pyright apps/core apps/dat_ingest config

  # ----------------------------------------------------------------
  # Job 4: Docker parity (backend)
  #
  # Trade-off:
  # - Adds a complementary gate to catch "passes on runner, fails in container".
  # - Increases CI duration by a few minutes.
  #
  # Optimizations:
  # - Uses only smoke checks (lint subset + critical tests subset).
  # - Reuses Actions service containers (Postgres/Redis) instead of full compose stack.
  # ----------------------------------------------------------------
  docker-parity-backend:
    name: "[required] docker parity (backend)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-impact
    if: needs.backend-impact.outputs.backend_changed == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Build backend image (official Dockerfile)
      run: |
        docker build -f v2/infra/Dockerfile -t aprender-backend:ci-parity-${{ github.sha }} v2

    - name: Run smoke checks inside container
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        ENVIRONMENT: testing
        DEBUG: "0"
        SECRET_KEY: test-secret-key-for-ci-only
        DB_HOST: host.docker.internal
        DB_PORT: "5432"
        DB_NAME: test_aprender
        DB_USER: postgres
        DB_PASSWORD: postgres
        REDIS_HOST: host.docker.internal
        REDIS_PORT: "6379"
        TZ: America/Fortaleza
        REQUIRE_DOCKER: "1"
        GCAL_CLIENT: fake
        GCAL_SEND_UPDATES: none
      run: |
        docker run --rm --add-host host.docker.internal:host-gateway \
          -e DJANGO_SETTINGS_MODULE \
          -e ENVIRONMENT \
          -e DEBUG \
          -e SECRET_KEY \
          -e DB_HOST \
          -e DB_PORT \
          -e DB_NAME \
          -e DB_USER \
          -e DB_PASSWORD \
          -e REDIS_HOST \
          -e REDIS_PORT \
          -e TZ \
          -e REQUIRE_DOCKER \
          -e GCAL_CLIENT \
          -e GCAL_SEND_UPDATES \
          aprender-backend:ci-parity-${{ github.sha }} \
          bash -lc '
            set -euo pipefail
            pip install --no-cache-dir pytest pytest-django black isort flake8
            black --check apps/core/auth_backends.py apps/core/models/__init__.py
            isort --check-only apps/core/auth_backends.py
            flake8 apps/core/auth_backends.py
            python manage.py migrate --noinput
            pytest -q --tb=short \
              apps/core/tests/test_modular_imports.py \
              apps/core/tests/test_auth_backends.py
          '

  # ----------------------------------------------------------------
  # Job 5: Required backend gate
  # Keeps the required "tests" check in ruleset while aggregating
  # runner tests + docker parity + typecheck.
  # ----------------------------------------------------------------
  tests:
    name: "[required] tests"
    runs-on: ubuntu-latest
    needs:
      - backend-impact
      - backend-tests
      - backend-typecheck
      - docker-parity-backend
    if: always()
    timeout-minutes: 5
    steps:
    - name: Assert backend gates passed
      run: |
        if [ "${{ needs.backend-impact.result }}" != "success" ]; then
          echo "backend-impact failed with result=${{ needs.backend-impact.result }}" >&2
          exit 1
        fi

        BACKEND_CHANGED="${{ needs.backend-impact.outputs.backend_changed }}"
        echo "backend_changed=${BACKEND_CHANGED}"

        if [ "${BACKEND_CHANGED}" = "true" ]; then
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed with result=${{ needs.backend-tests.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.backend-typecheck.result }}" != "success" ]; then
            echo "backend-typecheck failed with result=${{ needs.backend-typecheck.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.docker-parity-backend.result }}" != "success" ]; then
            echo "docker-parity-backend failed with result=${{ needs.docker-parity-backend.result }}" >&2
            exit 1
          fi
          echo "Backend impact detected: required backend jobs passed."
          exit 0
        fi

        if [ "${{ needs.backend-tests.result }}" != "skipped" ]; then
          echo "Expected backend-tests=skipped when backend_changed=false, got result=${{ needs.backend-tests.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.backend-typecheck.result }}" != "skipped" ]; then
          echo "Expected backend-typecheck=skipped when backend_changed=false, got result=${{ needs.backend-typecheck.result }}" >&2
          exit 1
        fi
        if [ "${{ needs.docker-parity-backend.result }}" != "skipped" ]; then
          echo "Expected docker-parity-backend=skipped when backend_changed=false, got result=${{ needs.docker-parity-backend.result }}" >&2
          exit 1
        fi
        echo "No backend impact detected: backend-heavy jobs skipped as expected."
