name: agent-browser-smoke

on:
  pull_request:
    branches: [main, feat/dashboard-compras-etl]
    paths:
      - "v2/frontend/**"
      - ".github/workflows/agent-browser-smoke.yml"
      - ".codex/docs/AGENT_BROWSER_SMOKE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-browser-smoke:
    name: "[info] agent-browser smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    defaults:
      run:
        working-directory: v2/frontend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "v2/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install agent-browser runtime dependencies and browsers
        # Run from repository root to avoid picking frontend-local Playwright binaries.
        working-directory: .
        run: npx --yes agent-browser@0.15.3 install --with-deps

      - name: Start frontend dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite-agent-browser.log 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start in time"
          tail -n 200 /tmp/vite-agent-browser.log || true
          exit 1

      - name: Run agent-browser smoke
        run: npm run smoke:agent-browser
        env:
          AGENT_BROWSER_NPX_PACKAGE: "agent-browser@0.15.3"
          AGENT_BROWSER_BASE_URL: "http://127.0.0.1:4173"
          AGENT_BROWSER_TARGET_PATH: "/login"

      - name: Collect local logs
        if: always()
        run: |
          mkdir -p test-results/agent-browser
          cp /tmp/vite-agent-browser.log test-results/agent-browser/vite.log || true

      - name: Stop frontend dev server
        if: always()
        run: |
          if [ -n "${VITE_PID:-}" ]; then
            kill "${VITE_PID}" || true
          fi

      - name: Upload agent-browser artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-browser-smoke-results
          path: v2/frontend/test-results/agent-browser
          if-no-files-found: ignore
          retention-days: 7
