name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      promotion_tag:
        description: "Required for production: existing tag validated in staging (example: v2026.03.05-abc1234)"
        required: false
        type: string

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          PROMOTION_TAG: ${{ github.event.inputs.promotion_tag }}
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            if [ -z "${PROMOTION_TAG:-}" ]; then
              echo "For production promotion, input 'promotion_tag' is required." >&2
              exit 1
            fi
            VERSION="$PROMOTION_TAG"
            MODE="production-promotion"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
            MODE="staging-release"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"
          echo "Release mode: $MODE"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt

      - name: Run final checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          python manage.py check --deploy

      - name: Create tag
        if: github.event.inputs.environment != 'production'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Validate promotion tag exists
        if: github.event.inputs.environment == 'production'
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Promotion tag '${{ steps.version.outputs.version }}' was not found in the repository tags." >&2
            exit 1
          fi

      # =========================================================================
      # Docker Hub Authentication & Build
      # =========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # =========================================================================
      # Pre-publish Security Gate (blocks HIGH/CRITICAL before push)
      # =========================================================================
      - name: Prepare release security artifact directory
        if: github.event.inputs.environment != 'production'
        run: mkdir -p supply-chain/security

      - name: Build Backend image for pre-release scan
        if: github.event.inputs.environment != 'production'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: false
          load: true
          tags: aprender-backend:scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Build Frontend image for pre-release scan
        if: github.event.inputs.environment != 'production'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: false
          load: true
          tags: aprender-frontend:scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Trivy report (backend pre-release)
        if: github.event.inputs.environment != 'production'
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: aprender-backend:scan-${{ github.run_id }}
          format: json
          output: supply-chain/security/trivy-backend-pre-release.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Generate Trivy report (frontend pre-release)
        if: github.event.inputs.environment != 'production'
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: aprender-frontend:scan-${{ github.run_id }}
          format: json
          output: supply-chain/security/trivy-frontend-pre-release.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Enforce security gate (block HIGH/CRITICAL on release publish)
        if: github.event.inputs.environment != 'production'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          backend_report = "supply-chain/security/trivy-backend-pre-release.json"
          frontend_report = "supply-chain/security/trivy-frontend-pre-release.json"

          def count_blocking(path: str) -> int:
              with open(path, encoding="utf-8") as fp:
                  data = json.load(fp)
              total = 0
              for result in data.get("Results", []):
                  for vuln in result.get("Vulnerabilities", []) or []:
                      if vuln.get("Severity") in {"HIGH", "CRITICAL"}:
                          total += 1
              return total

          backend_blocking = count_blocking(backend_report)
          frontend_blocking = count_blocking(frontend_report)
          total_blocking = backend_blocking + frontend_blocking

          print(f"Backend HIGH/CRITICAL vulnerabilities: {backend_blocking}")
          print(f"Frontend HIGH/CRITICAL vulnerabilities: {frontend_blocking}")
          print(f"Total HIGH/CRITICAL vulnerabilities: {total_blocking}")

          with open("supply-chain/security/gate-summary.txt", "w", encoding="utf-8") as fp:
              fp.write(f"backend_high_critical={backend_blocking}\n")
              fp.write(f"frontend_high_critical={frontend_blocking}\n")
              fp.write(f"total_high_critical={total_blocking}\n")

          if total_blocking > 0:
              print("Release blocked: HIGH/CRITICAL vulnerabilities detected in pre-release images.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload release security scan artifacts
        if: always() && github.event.inputs.environment != 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-security-scan-${{ steps.version.outputs.version }}
          path: supply-chain/security/
          if-no-files-found: warn
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend image
        id: build-backend
        if: github.event.inputs.environment != 'production'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.title=Aprender Sistema Backend
            org.opencontainers.image.description=Django backend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image
        id: build-frontend
        if: github.event.inputs.environment != 'production'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Frontend
            org.opencontainers.image.description=React frontend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Resolve image digests for deployment and evidence
        id: image-digests
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BACKEND_DIGEST_FROM_BUILD: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST_FROM_BUILD: ${{ steps.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail

          backend_digest=""
          frontend_digest=""

          if [ "$TARGET_ENV" = "production" ]; then
            docker pull "${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}"
            docker pull "${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}"

            backend_digest="$(docker image inspect "${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}" --format '{{index .RepoDigests 0}}' | sed 's|.*@||')"
            frontend_digest="$(docker image inspect "${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}" --format '{{index .RepoDigests 0}}' | sed 's|.*@||')"
          else
            backend_digest="$BACKEND_DIGEST_FROM_BUILD"
            frontend_digest="$FRONTEND_DIGEST_FROM_BUILD"
          fi

          if [ -z "$backend_digest" ] || [ -z "$frontend_digest" ]; then
            echo "Could not resolve backend/frontend digest for release version '${RELEASE_VERSION}'." >&2
            exit 1
          fi

          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "Resolved backend digest: $backend_digest"
          echo "Resolved frontend digest: $frontend_digest"

      # =========================================================================
      # Supply Chain Hardening (SBOM + Provenance Attestation)
      # =========================================================================
      - name: Prepare supply chain artifact directory
        run: mkdir -p supply-chain/attestations supply-chain/verification

      - name: Generate Backend SBOM (SPDX JSON)
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.image-digests.outputs.backend_digest }}
          format: spdx-json
          output-file: supply-chain/backend-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Frontend SBOM (SPDX JSON)
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.FRONTEND_IMAGE }}@${{ steps.image-digests.outputs.frontend_digest }}
          format: spdx-json
          output-file: supply-chain/frontend-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Backend image provenance
        id: attest-backend-image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.image-digests.outputs.backend_digest }}

      - name: Attest Frontend image provenance
        id: attest-frontend-image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.image-digests.outputs.frontend_digest }}

      - name: Attest SBOM files provenance
        id: attest-sbom-files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: supply-chain/*.spdx.json

      - name: Collect attestation bundles
        run: |
          cp "${{ steps.attest-backend-image.outputs.bundle-path }}" supply-chain/attestations/backend-image-provenance.bundle.jsonl
          cp "${{ steps.attest-frontend-image.outputs.bundle-path }}" supply-chain/attestations/frontend-image-provenance.bundle.jsonl
          cp "${{ steps.attest-sbom-files.outputs.bundle-path }}" supply-chain/attestations/sbom-files-provenance.bundle.jsonl

      - name: Upload supply chain artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ steps.version.outputs.version }}
          path: supply-chain/
          retention-days: 30

      # =========================================================================
      # Docker Scout Security Scan (Backend only - free tier limit)
      # =========================================================================
      - name: Docker Scout - Analyze Backend
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de # v1
        with:
          command: cves,recommendations
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          only-severities: critical,high

      - name: Docker Scout - Update production environment
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de # v1
        with:
          command: environment
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          environment: ${{ github.event.inputs.environment }}

      # =========================================================================
      # Release Notes
      # =========================================================================
      - name: Generate release notes
        run: |
          echo "# Release ${{ steps.version.outputs.version }}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> release_notes.md
          echo "**Mode:** ${{ steps.version.outputs.mode }}" >> release_notes.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> release_notes.md
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "**Promotion Source:** staging tag \`${{ steps.version.outputs.version }}\`" >> release_notes.md
            echo "**Latest Alias:** refreshed to \`${{ steps.version.outputs.version }}\` before deploy trigger" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "## Docker Images" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "  - Digest: \`${{ steps.image-digests.outputs.backend_digest }}\`" >> release_notes.md
          echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "  - Digest: \`${{ steps.image-digests.outputs.frontend_digest }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Supply Chain Artifacts" >> release_notes.md
          echo "" >> release_notes.md
          echo "- SBOM (SPDX): \`backend-sbom.spdx.json\`, \`frontend-sbom.spdx.json\`" >> release_notes.md
          echo "- Provenance bundles: backend/frontend images + SBOM files" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Pull Commands" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "" >> release_notes.md
          git log --oneline --since="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '1970-01-01')" >> release_notes.md || echo "First release" >> release_notes.md

      # =========================================================================
      # Deployment
      # =========================================================================
      - name: Release summary
        env:
          RELEASE_MODE: ${{ steps.version.outputs.mode }}
        run: |
          echo "========================================"
          echo "Release pipeline summary"
          echo "========================================"
          echo ""
          echo "Mode: $RELEASE_MODE"
          echo "Backend:  ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo ""
          echo "Deployment will now run from a configured command for '${{ github.event.inputs.environment }}'."

      - name: Resolve deploy command (required)
        id: resolve-deploy-command
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          STAGING_DEPLOY_COMMAND_SECRET: ${{ secrets.STAGING_DEPLOY_COMMAND || '' }}
          STAGING_DEPLOY_COMMAND_VAR: ${{ vars.STAGING_DEPLOY_COMMAND || '' }}
          PRODUCTION_DEPLOY_COMMAND_SECRET: ${{ secrets.PRODUCTION_DEPLOY_COMMAND || '' }}
          PRODUCTION_DEPLOY_COMMAND_VAR: ${{ vars.PRODUCTION_DEPLOY_COMMAND || '' }}
        run: |
          set -euo pipefail

          DEPLOY_COMMAND=""
          case "$TARGET_ENV" in
            staging)
              DEPLOY_COMMAND="$STAGING_DEPLOY_COMMAND_SECRET"
              if [ -z "$DEPLOY_COMMAND" ]; then
                DEPLOY_COMMAND="$STAGING_DEPLOY_COMMAND_VAR"
              fi
              ;;
            production)
              DEPLOY_COMMAND="$PRODUCTION_DEPLOY_COMMAND_SECRET"
              if [ -z "$DEPLOY_COMMAND" ]; then
                DEPLOY_COMMAND="$PRODUCTION_DEPLOY_COMMAND_VAR"
              fi
              ;;
            *)
              echo "Invalid environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "Deploy command for '$TARGET_ENV' is not configured." >&2
            echo "Configure secret or variable: STAGING_DEPLOY_COMMAND / PRODUCTION_DEPLOY_COMMAND." >&2
            exit 1
          fi

          echo "::add-mask::$DEPLOY_COMMAND"
          COMMAND_HASH="$(printf '%s' "$DEPLOY_COMMAND" | sha256sum | awk '{print $1}')"
          echo "command_hash=$COMMAND_HASH" >> "$GITHUB_OUTPUT"

          delimiter="EOF_$(date +%s%N)"
          {
            echo "DEPLOY_COMMAND<<$delimiter"
            echo "$DEPLOY_COMMAND"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Verify staging is running promoted release
        if: github.event.inputs.environment == 'production'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          STAGING_VERSIONCHECK_URL_SECRET: ${{ secrets.STAGING_VERSIONCHECK_URL || '' }}
          STAGING_VERSIONCHECK_URL_VAR: ${{ vars.STAGING_VERSIONCHECK_URL || '' }}
        run: |
          set -euo pipefail

          STAGING_VERSION_URL="$STAGING_VERSIONCHECK_URL_SECRET"
          if [ -z "$STAGING_VERSION_URL" ]; then
            STAGING_VERSION_URL="$STAGING_VERSIONCHECK_URL_VAR"
          fi

          if [ -z "$STAGING_VERSION_URL" ]; then
            echo "STAGING_VERSIONCHECK_URL is required to verify production promotion." >&2
            exit 1
          fi

          echo "::add-mask::$STAGING_VERSION_URL"
          response_file="supply-chain/verification/pre-prod-staging-version-response.txt"
          attempts=8
          sleep_seconds=8

          for attempt in $(seq 1 "$attempts"); do
            http_code="$(curl --silent --show-error --location --max-time 20 -o "$response_file" -w '%{http_code}' "$STAGING_VERSION_URL" || true)"
            if [ "$http_code" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "Could not read staging version endpoint (HTTP=${http_code:-curl_error})." >&2
              exit 1
            fi
            echo "Staging version check attempt ${attempt}/${attempts} failed (HTTP=${http_code:-curl_error}). Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

          if ! grep -Fq "$RELEASE_VERSION" "$response_file"; then
            echo "Staging version endpoint does not contain promoted release '$RELEASE_VERSION'." >&2
            cat "$response_file" >&2
            exit 1
          fi

          echo "Staging is serving release '$RELEASE_VERSION'. Proceeding with production promotion."

      - name: Promote selected release tag to latest (production)
        if: github.event.inputs.environment == 'production'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "Promoting release tag '${RELEASE_VERSION}' to :latest for production rollout."

          docker pull "${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}"
          docker pull "${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}"

          docker tag "${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}" "${{ env.BACKEND_IMAGE }}:latest"
          docker tag "${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}" "${{ env.FRONTEND_IMAGE }}:latest"

          docker push "${{ env.BACKEND_IMAGE }}:latest"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

          echo "Promotion to :latest completed."

      - name: Execute deploy command
        id: deploy-command
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          set -euo pipefail
          echo "Executing deploy for '$TARGET_ENV' with release '$RELEASE_VERSION'."
          bash -lc "$DEPLOY_COMMAND"

      - name: Resolve post-deploy verification endpoints (required)
        id: resolve-post-deploy-verification
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          STAGING_HEALTHCHECK_URL_SECRET: ${{ secrets.STAGING_HEALTHCHECK_URL || '' }}
          STAGING_HEALTHCHECK_URL_VAR: ${{ vars.STAGING_HEALTHCHECK_URL || '' }}
          PRODUCTION_HEALTHCHECK_URL_SECRET: ${{ secrets.PRODUCTION_HEALTHCHECK_URL || '' }}
          PRODUCTION_HEALTHCHECK_URL_VAR: ${{ vars.PRODUCTION_HEALTHCHECK_URL || '' }}
          STAGING_VERSIONCHECK_URL_SECRET: ${{ secrets.STAGING_VERSIONCHECK_URL || '' }}
          STAGING_VERSIONCHECK_URL_VAR: ${{ vars.STAGING_VERSIONCHECK_URL || '' }}
          PRODUCTION_VERSIONCHECK_URL_SECRET: ${{ secrets.PRODUCTION_VERSIONCHECK_URL || '' }}
          PRODUCTION_VERSIONCHECK_URL_VAR: ${{ vars.PRODUCTION_VERSIONCHECK_URL || '' }}
        run: |
          set -euo pipefail

          HEALTHCHECK_URL=""
          VERSIONCHECK_URL=""
          case "$TARGET_ENV" in
            staging)
              HEALTHCHECK_URL="$STAGING_HEALTHCHECK_URL_SECRET"
              if [ -z "$HEALTHCHECK_URL" ]; then
                HEALTHCHECK_URL="$STAGING_HEALTHCHECK_URL_VAR"
              fi
              VERSIONCHECK_URL="$STAGING_VERSIONCHECK_URL_SECRET"
              if [ -z "$VERSIONCHECK_URL" ]; then
                VERSIONCHECK_URL="$STAGING_VERSIONCHECK_URL_VAR"
              fi
              ;;
            production)
              HEALTHCHECK_URL="$PRODUCTION_HEALTHCHECK_URL_SECRET"
              if [ -z "$HEALTHCHECK_URL" ]; then
                HEALTHCHECK_URL="$PRODUCTION_HEALTHCHECK_URL_VAR"
              fi
              VERSIONCHECK_URL="$PRODUCTION_VERSIONCHECK_URL_SECRET"
              if [ -z "$VERSIONCHECK_URL" ]; then
                VERSIONCHECK_URL="$PRODUCTION_VERSIONCHECK_URL_VAR"
              fi
              ;;
            *)
              echo "Invalid environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "Healthcheck URL for '$TARGET_ENV' is not configured." >&2
            echo "Configure secret or variable: STAGING_HEALTHCHECK_URL / PRODUCTION_HEALTHCHECK_URL." >&2
            exit 1
          fi

          if [ -z "$VERSIONCHECK_URL" ]; then
            echo "Versioncheck URL for '$TARGET_ENV' is not configured." >&2
            echo "Configure secret or variable: STAGING_VERSIONCHECK_URL / PRODUCTION_VERSIONCHECK_URL." >&2
            exit 1
          fi

          echo "::add-mask::$HEALTHCHECK_URL"
          echo "::add-mask::$VERSIONCHECK_URL"
          echo "healthcheck_url=$HEALTHCHECK_URL" >> "$GITHUB_OUTPUT"
          echo "versioncheck_url=$VERSIONCHECK_URL" >> "$GITHUB_OUTPUT"
          echo "HEALTHCHECK_URL=$HEALTHCHECK_URL" >> "$GITHUB_ENV"
          echo "VERSIONCHECK_URL=$VERSIONCHECK_URL" >> "$GITHUB_ENV"

      - name: Post-deploy verification (health + version)
        id: post-deploy-verification
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local label="$2"
            local attempts=12
            local sleep_seconds=10
            local response_file
            response_file="$(mktemp)"

            for attempt in $(seq 1 "$attempts"); do
              local http_code
              http_code="$(curl --silent --show-error --location --max-time 20 -o "$response_file" -w '%{http_code}' "$url" || true)"
              if [ "$http_code" = "200" ]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi
              echo "Attempt ${attempt}/${attempts} failed for ${label} (HTTP=${http_code:-curl_error}). Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            done

            echo "Post-deploy ${label} check failed after ${attempts} attempts." >&2
            if [ -s "$response_file" ]; then
              echo "Last ${label} response:" >&2
              cat "$response_file" >&2
            fi
            rm -f "$response_file"
            return 1
          }

          echo "Running post-deploy health check..."
          HEALTH_RESPONSE="$(fetch_with_retry "$HEALTHCHECK_URL" "health")"
          printf '%s\n' "$HEALTH_RESPONSE" > supply-chain/verification/post-deploy-health-response.txt

          echo "Running post-deploy version check..."
          VERSION_RESPONSE="$(fetch_with_retry "$VERSIONCHECK_URL" "version")"
          printf '%s\n' "$VERSION_RESPONSE" > supply-chain/verification/post-deploy-version-response.txt

          if ! printf '%s' "$VERSION_RESPONSE" | grep -Fq "$RELEASE_VERSION"; then
            echo "Version endpoint response does not contain release version '$RELEASE_VERSION'." >&2
            exit 1
          fi

          echo "verification=passed" >> "$GITHUB_OUTPUT"

      - name: Append deployment verification to release notes
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          HEALTHCHECK_URL: ${{ steps.resolve-post-deploy-verification.outputs.healthcheck_url }}
          VERSIONCHECK_URL: ${{ steps.resolve-post-deploy-verification.outputs.versioncheck_url }}
        run: |
          {
            echo ""
            echo "## Deployment Verification"
            echo ""
            echo "- Environment: \`$TARGET_ENV\`"
            echo "- Release version validated: \`$RELEASE_VERSION\`"
            echo "- Healthcheck URL: \`$HEALTHCHECK_URL\`"
            echo "- Versioncheck URL: \`$VERSIONCHECK_URL\`"
            echo "- Status: \`passed\`"
          } >> release_notes.md

      - name: Generate deploy evidence
        if: always()
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_OUTCOME: ${{ steps.deploy-command.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.post-deploy-verification.outcome }}
          HEALTHCHECK_URL: ${{ steps.resolve-post-deploy-verification.outputs.healthcheck_url }}
          VERSIONCHECK_URL: ${{ steps.resolve-post-deploy-verification.outputs.versioncheck_url }}
          COMMAND_HASH: ${{ steps.resolve-deploy-command.outputs.command_hash }}
          BACKEND_DIGEST: ${{ steps.image-digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.image-digests.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "repository=${{ github.repository }}"
            echo "environment=$TARGET_ENV"
            echo "release_version=$RELEASE_VERSION"
            echo "deploy_outcome=$DEPLOY_OUTCOME"
            echo "verification_outcome=$VERIFICATION_OUTCOME"
            echo "healthcheck_url=$HEALTHCHECK_URL"
            echo "versioncheck_url=$VERSIONCHECK_URL"
            echo "backend_image=${{ env.BACKEND_IMAGE }}"
            echo "backend_digest=$BACKEND_DIGEST"
            echo "frontend_image=${{ env.FRONTEND_IMAGE }}"
            echo "frontend_digest=$FRONTEND_DIGEST"
            echo "deploy_command_sha256=$COMMAND_HASH"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deploy-evidence.txt

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-evidence-${{ github.run_id }}
          path: deploy-evidence.txt
          retention-days: 30

      - name: Create GitHub Release
        if: github.event.inputs.environment != 'production'
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Ensure GitHub Release exists for promotion tag
        if: github.event.inputs.environment == 'production'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ steps.version.outputs.version }}" >/dev/null

      - name: Upload release assets (SBOM + provenance + evidence)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(
            "supply-chain/backend-sbom.spdx.json"
            "supply-chain/frontend-sbom.spdx.json"
            "supply-chain/attestations/backend-image-provenance.bundle.jsonl"
            "supply-chain/attestations/frontend-image-provenance.bundle.jsonl"
            "supply-chain/attestations/sbom-files-provenance.bundle.jsonl"
            "supply-chain/verification/post-deploy-health-response.txt"
            "supply-chain/verification/post-deploy-version-response.txt"
            "deploy-evidence.txt"
          )

          if [ -f "supply-chain/verification/pre-prod-staging-version-response.txt" ]; then
            files+=("supply-chain/verification/pre-prod-staging-version-response.txt")
          fi

          gh release upload "${{ steps.version.outputs.version }}" "${files[@]}" --clobber
