---
# ======================================
# 🔄 PRE-COMMIT HOOKS - SISTEMA APRENDER
# Automated Code Quality & Security Checks
# ======================================
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

default_stages: [pre-commit, pre-push]
fail_fast: false

repos:
  # ==========================================
  # PYTHON CODE FORMATTING & QUALITY
  # ==========================================

  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: 🎨 Format Python code (Black)
        language_version: python3
        args: [--line-length=88, --target-version=py312]
        exclude: migrations/

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: 📐 Sort Python imports (isort)
        args: [--profile=black, --line-length=88, --multi-line=3]
        exclude: migrations/

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: 🕵️ Lint Python code (Flake8)
        args: [--max-line-length=88, --extend-ignore=E203,W503]
        exclude: migrations/

  # ==========================================
  # SECURITY & VULNERABILITY CHECKS
  # ==========================================

  # Security analysis with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: 🔒 Security scan (Bandit)
        args: [-r, ., -ll, --skip=B101,B601]
        exclude: ^(tests/|migrations/|venv/|manage\.py|scripts/)

  # Dependency vulnerability checking
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.4.2
    hooks:
      - id: python-safety-dependencies-check
        name: 🛡️ Check dependencies (Safety)
        args: [--ignore=70612]

  # ==========================================
  # DJANGO-SPECIFIC CHECKS (DOCKER)
  # ==========================================

  - repo: local
    hooks:
      - id: django-system-check
        name: ⚙️ Django system check (docker)
        language: script
        entry: scripts/precommit-django.sh check
        pass_filenames: false
        stages: [pre-commit]

      - id: django-migrations
        name: 🗄️ Django makemigrations --check (docker)
        language: script
        entry: scripts/precommit-django.sh makemigrations
        pass_filenames: false
        stages: [pre-commit]

      - id: django-showmigrations
        name: 🧪 Django showmigrations (docker)
        language: script
        entry: scripts/precommit-django.sh showmigrations
        pass_filenames: false
        stages: [pre-commit]

  # ==========================================
  # GENERAL FILE & CONTENT CHECKS
  # ==========================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File formatting and cleanup
      - id: trailing-whitespace
        name: 🧹 Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: 📄 Fix end of file
      - id: mixed-line-ending
        name: 🔄 Fix line endings
        args: [--fix=lf]

      # File validation
      - id: check-json
        name: ✅ Validate JSON files
      - id: check-yaml
        name: ✅ Validate YAML files
        args: [--unsafe]
      - id: check-toml
        name: ✅ Validate TOML files
      - id: check-xml
        name: ✅ Validate XML files

      # Security and safety checks
      - id: detect-private-key
        name: 🔑 Detect private keys
      - id: check-merge-conflict
        name: 🔀 Check merge conflicts
      - id: check-added-large-files
        name: 📦 Check large files
        args: [--maxkb=2000]

      # Python-specific checks
      - id: check-ast
        name: 🐍 Check Python AST
      - id: debug-statements
        name: 🐛 Check debug statements
        exclude: migrations/
      - id: requirements-txt-fixer
        name: 📋 Fix requirements.txt

      # Documentation checks
      - id: check-docstring-first
        name: 📝 Check docstring first
        exclude: migrations/

  # ==========================================
  # ADDITIONAL QUALITY CHECKS
  # ==========================================

  # Conventional commits (optional but recommended)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: 📝 Conventional commits format
        stages: [commit-msg]

  # Secrets detection (additional layer)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: 🔍 Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

# ==========================================
# GLOBAL CONFIGURATION
# ==========================================

# Global exclusions - files/directories to ignore
exclude: |
  (?x)(
    ^migrations/|
    ^__pycache__/|
    \.pyc$|
    \.pyo$|
    \.sqlite3$|
    ^staticfiles/|
    ^media/|
    ^logs/|
    ^venv/|
    ^\.venv/|
    ^node_modules/|
    ^\.git/|
    ^archive/|
    ^backups/|
    ^test_reports/|
    ^lint_reports/|
    ^htmlcov/|
    \.coverage$|
    bandit-report\.json$|
    safety-report\.json$
  )

# Minimum pre-commit version required
minimum_pre_commit_version: 3.0.0
