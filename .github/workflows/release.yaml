name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt

      - name: Run final checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          python manage.py check --deploy

      - name: Create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # =========================================================================
      # Docker Hub Authentication & Build
      # =========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Backend
            org.opencontainers.image.description=Django backend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Frontend
            org.opencontainers.image.description=React frontend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # =========================================================================
      # Docker Scout Security Scan (Backend only - free tier limit)
      # =========================================================================
      - name: Docker Scout - Analyze Backend
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          only-severities: critical,high

      - name: Docker Scout - Update production environment
        uses: docker/scout-action@v1
        with:
          command: environment
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          environment: production

      # =========================================================================
      # Release Notes
      # =========================================================================
      - name: Generate release notes
        run: |
          echo "# Release ${{ steps.version.outputs.version }}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> release_notes.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Docker Images" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Pull Commands" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "" >> release_notes.md
          git log --oneline --since="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '1970-01-01')" >> release_notes.md || echo "First release" >> release_notes.md

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      # =========================================================================
      # Deployment
      # =========================================================================
      - name: Deploy notification
        run: |
          echo "========================================"
          echo "Docker images published to Docker Hub!"
          echo "========================================"
          echo ""
          echo "Backend:  ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo ""
          echo "To deploy, run:"
          echo "  IMAGE_TAG=${{ steps.version.outputs.version }} docker compose -f docker-compose.prod.yml up -d"

      - name: Deploy to staging
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands here (e.g., SSH to server, kubectl apply, etc.)

      - name: Deploy to production
        if: github.event.inputs.environment == 'production'
        run: |
          echo "Deploying to production environment..."
          # Add production deployment commands here (e.g., SSH to server, kubectl apply, etc.)
