[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
testpaths = apps
# Avoid test DB race condition when running pytest multiple times
django_db_suffix = _{worker_id}
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    performance: marks tests as performance tests (deselect with '-m "not performance"')
    migrations: tests que exercitam funcoes de data-migration RunPython (rodam no job migrate-integrity COM migrations; tambem passam sob --no-migrations). #1404

# =============================================================================
# Coverage Configuration (Issues #268, #850)
# Official threshold: 85% — applied consistently across pytest.ini, CI combine
# step, and policy doc at v2/docs/analysis/COVERAGE_POLICY.md.
# =============================================================================
[coverage:run]
source = apps
branch = True
omit =
    */migrations/*
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
fail_under = 85
show_missing = True
skip_covered = False
