<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Aprender Sistema</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 1rem;
    }
    h1 {
      color: #1890ff;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    p {
      color: #666;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    button {
      background: #1890ff;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #40a9ff;
    }
    button:active {
      background: #096dd9;
    }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128225;</div>
    <h1>Voce esta offline</h1>
    <p>
      Nao foi possivel conectar ao servidor.
      Verifique sua conexao com a internet e tente novamente.
    </p>
    <button onclick="location.reload()">Tentar Novamente</button>
    <p class="hint">
      Algumas funcionalidades podem estar disponiveis offline.
    </p>
  </div>
</body>
</html>
