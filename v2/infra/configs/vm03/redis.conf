# Redis config para AS v2
# VM03: 2 vCPU, 4GB RAM
# Referência: PLAN_infrastructure_scaling.md

#------------------------------------------------------------------------------
# NETWORK
#------------------------------------------------------------------------------
bind 10.0.0.3
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 300

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------
# IMPORTANTE: Substituir por senha forte em produção
requirepass CHANGE_ME_STRONG_PASSWORD

# Desabilitar comandos perigosos
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b4ck3nd_s3cr3t"

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------
maxmemory 3gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

#------------------------------------------------------------------------------
# PERSISTENCE - RDB
#------------------------------------------------------------------------------
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

#------------------------------------------------------------------------------
# PERSISTENCE - AOF
#------------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

#------------------------------------------------------------------------------
# CLIENTS
#------------------------------------------------------------------------------
maxclients 1000

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
loglevel notice
logfile /var/log/redis/redis-server.log

#------------------------------------------------------------------------------
# SLOW LOG
#------------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
