name: Architecture Guardrails

on:
  # Guardrails de arquitetura (import-linter backend + dependency-cruiser frontend)
  # so importam quando o codigo muda. Path filters evitam runs em PRs so-docs.
  # NAO e required check (nem ruleset nem branch protection), entao skip nao trava merge.
  push:
    branches:
      - main
    paths:
      - 'v2/backend/**'
      - 'v2/frontend/**'
      - '.github/workflows/architecture-guardrails.yml'
      - '.github/actions/setup-node-deps/**'
  pull_request:
    branches:
      - main
    paths:
      - 'v2/backend/**'
      - 'v2/frontend/**'
      - '.github/workflows/architecture-guardrails.yml'
      - '.github/actions/setup-node-deps/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-dependency-guardrails:
    name: "[required] architecture dependency guardrails"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Run backend architecture guard (import-linter)
        id: backend_guard
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install "import-linter==2.6"

          cd v2/backend
          python scripts/run_import_linter.py | tee "${GITHUB_WORKSPACE}/architecture-backend.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: ./.github/actions/setup-node-deps

      - name: Run frontend architecture guard (dependency-cruiser)
        id: frontend_guard
        run: |
          set +e
          cd v2/frontend
          npm run deps:check | tee "${GITHUB_WORKSPACE}/architecture-frontend.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload architecture logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: architecture-guardrails-logs
          path: |
            architecture-backend.log
            architecture-frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Assert architecture guardrails
        env:
          BACKEND_STATUS: ${{ steps.backend_guard.outputs.status }}
          FRONTEND_STATUS: ${{ steps.frontend_guard.outputs.status }}
        run: |
          set -euo pipefail

          backend_status="${BACKEND_STATUS:-1}"
          frontend_status="${FRONTEND_STATUS:-1}"

          {
            echo "### Architecture Guardrails"
            echo "- Backend import-linter exit: ${backend_status}"
            echo "- Frontend dependency-cruiser exit: ${frontend_status}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$backend_status" != "0" ]; then
            echo "Backend architecture guard failed. See architecture-backend.log artifact." >&2
            exit 1
          fi

          if [ "$frontend_status" != "0" ]; then
            echo "Frontend architecture guard failed. See architecture-frontend.log artifact." >&2
            exit 1
          fi

          echo "Architecture guardrails passed."
