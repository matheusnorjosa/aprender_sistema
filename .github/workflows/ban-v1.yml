name: ban-v1
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: v2

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect changed files
        id: diff
        run: |
          # Use PR base SHA when available (in pull_request events)
          # Fall back to merge-base for push events
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            # Fetch base ref to ensure BASE commit is available
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          else
            git fetch origin main --depth=1
            BASE=$(git merge-base HEAD origin/main)
          fi
          echo "base_commit=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE"..HEAD > ../changed.txt
      - name: Forbid legacy edits
        run: |
          if grep -q '^archive/v1_legado/' ../changed.txt; then
            echo "archive/v1_legado é apenas consulta" >&2
            exit 1
          fi
      - name: Forbid legacy strings
        run: |
          if git diff "${{ steps.diff.outputs.base_commit }}"..HEAD | \
             grep -E '(aprendersistema|web-1|db-1|redis-1|docker-compose.*v1)'; then
            echo "Referência v1 detectada" >&2
            exit 1
          fi
      - name: Create CI .env
        run: |
          cat > infra/.env <<EOF
          POSTGRES_USER=aprender_user
          POSTGRES_PASSWORD=aprender_password
          POSTGRES_DB=aprender_db
          DB_HOST=db
          DB_PORT=5432
          SECRET_KEY=test-secret-key-for-ci-only
          DEBUG=1
          ENVIRONMENT=development
          REDIS_HOST=redis
          REDIS_PORT=6379
          REQUIRE_DOCKER=1
          EOF
      - name: Docker up
        run: make up
      - name: readyz
        run: make readyz
      - name: healthz
        run: make healthz
      - name: docker ps
        run: docker compose -f infra/docker-compose.yml ps
      - name: Tear down
        if: always()
        run: make down || true
