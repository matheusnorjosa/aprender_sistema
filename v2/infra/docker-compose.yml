name: aprender_v2
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # CP2: Redis persistence com RDB snapshots
    # save 60 1 = snapshot a cada 60s se houver >= 1 mudança
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: gunicorn config.wsgi:application --config /app/infra/gunicorn.conf.py
    env_file: .env
    environment:
      # Gunicorn Configuration (CP1 - Performance Optimization)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
    depends_on:
      - db
      - redis
    ports:
      - "8002:8000"
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config beat -l info
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro

volumes:
  db_data:
  redis_data:  # CP2: Persistência Redis (sessões)
