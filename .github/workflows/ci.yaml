name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aprender
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r v2/backend/requirements.txt
        pip install flake8 pytest pytest-django

    - name: Set up environment
      run: |
        echo "DJANGO_SETTINGS_MODULE=config.settings" >> $GITHUB_ENV
        echo "ENVIRONMENT=testing" >> $GITHUB_ENV
        echo "DEBUG=False" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DB_NAME=test_aprender" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "REDIS_HOST=localhost" >> $GITHUB_ENV
        echo "REDIS_PORT=6379" >> $GITHUB_ENV
        echo "REQUIRE_DOCKER=0" >> $GITHUB_ENV
        echo "TZ=America/Fortaleza" >> $GITHUB_ENV

    - name: Run migrations
      run: |
        cd v2/backend
        python manage.py migrate --noinput

    - name: Django check --deploy
      run: |
        cd v2/backend
        python manage.py check --deploy

    - name: Run linting
      run: |
        cd v2/backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        cd v2/backend
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete 2>/dev/null || true
        # TEMP: Quarentena dat_ingest até concluir #39 (ImportErrors)
        # Ver também #35, #36, #37, #38
        pytest -q --tb=short -k "not dat_ingest"

    - name: Build Docker image
      run: |
        cd v2/infra
        docker compose build web

    - name: Test Docker health
      run: |
        cd v2/infra
        cat > .env <<EOF
        POSTGRES_USER=aprender_user
        POSTGRES_PASSWORD=aprender_password
        POSTGRES_DB=aprender_db
        DB_HOST=db
        DB_PORT=5432
        SECRET_KEY=test-secret-key-for-ci-only
        DEBUG=1
        ENVIRONMENT=development
        REDIS_HOST=redis
        REDIS_PORT=6379
        REQUIRE_DOCKER=1
        EOF
        docker compose up -d db redis
        sleep 5
        docker compose run --rm web python manage.py check
        docker compose down

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r v2/backend -f json -o bandit-report.json || true

    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
