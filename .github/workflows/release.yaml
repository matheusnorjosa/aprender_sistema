name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt

      - name: Run final checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          python manage.py check --deploy

      - name: Create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # =========================================================================
      # Docker Hub Authentication & Build
      # =========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Backend
            org.opencontainers.image.description=Django backend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aprender Sistema Frontend
            org.opencontainers.image.description=React frontend for Aprender Sistema
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # =========================================================================
      # Docker Scout Security Scan (Backend only - free tier limit)
      # =========================================================================
      - name: Docker Scout - Analyze Backend
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de # v1
        with:
          command: cves,recommendations
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          only-severities: critical,high

      - name: Docker Scout - Update production environment
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de # v1
        with:
          command: environment
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          organization: norjosamatheus
          environment: production

      # =========================================================================
      # Release Notes
      # =========================================================================
      - name: Generate release notes
        run: |
          echo "# Release ${{ steps.version.outputs.version }}" > release_notes.md
          echo "" >> release_notes.md
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> release_notes.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Docker Images" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Pull Commands" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "" >> release_notes.md
          git log --oneline --since="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '1970-01-01')" >> release_notes.md || echo "First release" >> release_notes.md

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      # =========================================================================
      # Deployment
      # =========================================================================
      - name: Release summary
        run: |
          echo "========================================"
          echo "Docker images published to Docker Hub!"
          echo "========================================"
          echo ""
          echo "Backend:  ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo ""
          echo "Deployment will now run from a configured command for '${{ github.event.inputs.environment }}'."

      - name: Resolve deploy command (required)
        id: resolve-deploy-command
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          STAGING_DEPLOY_COMMAND_SECRET: ${{ secrets.STAGING_DEPLOY_COMMAND || '' }}
          STAGING_DEPLOY_COMMAND_VAR: ${{ vars.STAGING_DEPLOY_COMMAND || '' }}
          PRODUCTION_DEPLOY_COMMAND_SECRET: ${{ secrets.PRODUCTION_DEPLOY_COMMAND || '' }}
          PRODUCTION_DEPLOY_COMMAND_VAR: ${{ vars.PRODUCTION_DEPLOY_COMMAND || '' }}
        run: |
          set -euo pipefail

          DEPLOY_COMMAND=""
          case "$TARGET_ENV" in
            staging)
              DEPLOY_COMMAND="$STAGING_DEPLOY_COMMAND_SECRET"
              if [ -z "$DEPLOY_COMMAND" ]; then
                DEPLOY_COMMAND="$STAGING_DEPLOY_COMMAND_VAR"
              fi
              ;;
            production)
              DEPLOY_COMMAND="$PRODUCTION_DEPLOY_COMMAND_SECRET"
              if [ -z "$DEPLOY_COMMAND" ]; then
                DEPLOY_COMMAND="$PRODUCTION_DEPLOY_COMMAND_VAR"
              fi
              ;;
            *)
              echo "Invalid environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "Deploy command for '$TARGET_ENV' is not configured." >&2
            echo "Configure secret or variable: STAGING_DEPLOY_COMMAND / PRODUCTION_DEPLOY_COMMAND." >&2
            exit 1
          fi

          echo "::add-mask::$DEPLOY_COMMAND"
          COMMAND_HASH="$(printf '%s' "$DEPLOY_COMMAND" | sha256sum | awk '{print $1}')"
          echo "command_hash=$COMMAND_HASH" >> "$GITHUB_OUTPUT"

          delimiter="EOF_$(date +%s%N)"
          {
            echo "DEPLOY_COMMAND<<$delimiter"
            echo "$DEPLOY_COMMAND"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Execute deploy command
        id: deploy-command
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          set -euo pipefail
          echo "Executing deploy for '$TARGET_ENV' with release '$RELEASE_VERSION'."
          bash -lc "$DEPLOY_COMMAND"

      - name: Generate deploy evidence
        if: always()
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_OUTCOME: ${{ steps.deploy-command.outcome }}
          COMMAND_HASH: ${{ steps.resolve-deploy-command.outputs.command_hash }}
        run: |
          set -euo pipefail
          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "repository=${{ github.repository }}"
            echo "environment=$TARGET_ENV"
            echo "release_version=$RELEASE_VERSION"
            echo "deploy_outcome=$DEPLOY_OUTCOME"
            echo "deploy_command_sha256=$COMMAND_HASH"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deploy-evidence.txt

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-evidence-${{ github.run_id }}
          path: deploy-evidence.txt
          retention-days: 30
