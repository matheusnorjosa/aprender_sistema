# ======================================
# 🔧 SUPERVISOR CONFIGURATION - PRODUCTION
# Sistema Aprender
# ======================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==========================================
# DJANGO APPLICATION
# ==========================================
[program:django]
command=python manage.py runserver 0.0.0.0:8000
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/django.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",DJANGO_SETTINGS_MODULE="aprender_sistema.settings"

# ==========================================
# NGINX WEB SERVER
# ==========================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

# ==========================================
# DJANGO MANAGEMENT COMMANDS (Optional)
# ==========================================

# Django Log Cleanup (runs daily)
[program:log_cleanup]
command=python manage.py cleanup_logs
directory=/app
user=appuser
autostart=false
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/app/logs/cleanup.log

# Django Cache Warming (runs on startup)
[program:cache_warmup]
command=python manage.py warm_cache
directory=/app
user=appuser
autostart=false
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/app/logs/warmup.log

# ==========================================
# HEALTH CHECK PROCESS
# ==========================================
[program:healthcheck]
command=/bin/bash -c "while true; do curl -f http://localhost:8000/health/ > /dev/null 2>&1 || echo 'Health check failed'; sleep 30; done"
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/healthcheck.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

# ==========================================
# EVENT LISTENERS
# ==========================================
[eventlistener:memmon]
command=memmon -a 200MB -m ops@aprender.com
events=TICK_60
user=root
autostart=false
autorestart=true