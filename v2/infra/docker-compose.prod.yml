# =============================================================================
# Docker Compose - Production Configuration
# =============================================================================
# Topologia:
#   VM01_App  — esta stack (web, worker, beat, frontend, redis)
#   VM02_Banco — PostgreSQL externo (DB_HOST apontando para IP da VM02)
#   Redis — container local nesta stack (serviço "redis")
#
# Deploy:
#   GitHub Actions publica imagens no Docker Hub e aciona redeploy
#   via Portainer CE API. Não há polling automático (Watchtower removido).
#
# Variaveis obrigatorias no .env (ou stack.env no Portainer):
#   IMAGE_TAG
#   DB_HOST, DB_NAME, DB_USER, DB_PASSWORD
#   REDIS_HOST, REDIS_PASSWORD, REDIS_PORT, SECRET_KEY
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-aprender_prod}

  # ================================================================
  # SEC-006: Container Runtime Hardening (OWASP Docker Security)
  # ================================================================
  # All services apply:
  #   - security_opt: no-new-privileges (prevent privilege escalation)
  #   - cap_drop: ALL (drop all Linux capabilities)
  #   - read_only: true (immutable root filesystem)
  #   - tmpfs for /tmp and /run (writable temp dirs in memory)
  # Backend Dockerfiles run as non-root (USER appuser / USER nginx)
  # ================================================================

services:
  web:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: gunicorn config.wsgi:application --config /app/infra/gunicorn.conf.py
    # SEC-014: Resource limits (VM01: 16GB/4vCPU)
    mem_limit: 4g
    cpus: 1.5
    env_file:
      - ${APP_ENV_FILE:-stack.env}
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      REQUIRE_DOCKER: "1"
      SERVICE_NAME: web
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/readyz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /run:size=10M
      - /home/appuser:size=10M
      - /app/out_etl:size=50M
    # SEC-015: web needs backend (redis) + frontend-proxy (nginx→web)
    networks:
      - backend-internal
      - frontend-proxy

  redis:
    image: redis:7-alpine
    # SEC-013: AOF persistence + maxmemory to prevent OOM
    command: >-
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 1536mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1
    # SEC-014: Resource limits (VM01: 16GB/4vCPU)
    mem_limit: 2g
    cpus: 0.5
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    # Note: Redis needs write access to /data volume for AOF persistence
    # and capabilities for its entrypoint. cap_drop/read_only removed
    # because they prevent Redis from accessing appendonlydir.
    # SEC-015: Redis only accessible from backend services
    networks:
      - backend-internal

  worker:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: celery -A config worker -l info
    # SEC-014: Resource limits (VM01: 16GB/4vCPU)
    mem_limit: 3g
    cpus: 1.0
    env_file:
      - ${APP_ENV_FILE:-stack.env}
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      REQUIRE_DOCKER: "1"
      SERVICE_NAME: worker
    depends_on:
      - redis
    healthcheck:
      # Lightweight check: verify celery main process is alive via pidfile
      test: ["CMD-SHELL", "python -c \"import os,signal; os.kill(1, 0)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /run:size=10M
      - /home/appuser:size=10M
      - /app/out_etl:size=50M
    # SEC-015: Worker only needs backend services
    networks:
      - backend-internal

  beat:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    # --schedule /tmp/celerybeat-schedule: write schedule to tmpfs (read_only filesystem)
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    # SEC-014: Resource limits
    mem_limit: 512m
    cpus: 0.5
    env_file:
      - ${APP_ENV_FILE:-stack.env}
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      REQUIRE_DOCKER: "1"
      SERVICE_NAME: beat
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import celery; print(celery.__version__)' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M
      - /run:size=10M
      - /home/appuser:size=10M
      - /app/out_etl:size=10M
    # SEC-015: Beat only needs backend services
    networks:
      - backend-internal

  frontend:
    image: norjosamatheus/aprender-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    # SEC-014: Resource limits (VM01: 16GB/4vCPU)
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "${FRONTEND_PORT:-81}:80"
    depends_on:
      - web
    # SEC-015: Frontend only reaches web (proxy) + NPM (external)
    networks:
      - frontend-proxy
      - shared_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Note: read_only not used for nginx — it needs writable /var/cache/nginx,
    # /etc/nginx/conf.d (entrypoint IPv6 config), and /var/run (pid file).
    # Hardening via non-root (USER nginx) + cap_drop: ALL + no-new-privileges.

# Rede externa compartilhada com NPM (Nginx Proxy Manager).
# Deve ser criada uma vez na VM01: docker network create shared_proxy
volumes:
  redis_data:

# SEC-015: Network segmentation
# backend-internal: web ↔ redis ↔ worker ↔ beat (needs egress to VM02 PostgreSQL)
# frontend-proxy: frontend ↔ web (NPM routes traffic through this network)
# shared_proxy: frontend ↔ Nginx Proxy Manager (external)
#
# Security model: Redis/worker/beat are isolated in backend-internal.
# Frontend and web are in frontend-proxy (reachable by NPM via shared_proxy).
# No container on frontend-proxy can reach Redis or Celery directly.
networks:
  backend-internal:
    # Note: NOT internal — backend services need egress to VM02 (PostgreSQL)
    driver: bridge
  frontend-proxy:
    driver: bridge
  shared_proxy:
    external: true
