name: V2 CI

on:
  push:
    branches:
      - rebuild/2025-contexto-supremo
      - main-v1
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches:
      - main-v1
    paths:
      - 'v2/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aprender_db_test
          POSTGRES_USER: aprender_user
          POSTGRES_PASSWORD: aprender_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'v2/backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt
          pip install black isort flake8 pytest pytest-django pytest-cov

      - name: Lint with Black
        run: |
          cd v2/backend
          black --check --diff .

      - name: Lint with isort
        run: |
          cd v2/backend
          isort --check-only --diff .

      - name: Lint with Flake8
        run: |
          cd v2/backend
          flake8 --max-line-length=120 --extend-ignore=E203,W503 .

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "0"
          DB_NAME: aprender_db_test
          DB_USER: aprender_user
          DB_PASSWORD: aprender_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          python manage.py check --deploy

      - name: Run Migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "1"
          DB_NAME: aprender_db_test
          DB_USER: aprender_user
          DB_PASSWORD: aprender_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          python manage.py migrate --noinput

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "1"
          DB_NAME: aprender_db_test
          DB_USER: aprender_user
          DB_PASSWORD: aprender_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REQUIRE_DOCKER: "0"
        run: |
          cd v2/backend
          # TEMP: Quarentena dat_ingest até concluir #39 (ImportErrors)
          # Ver também #35, #36, #37, #38
          pytest -q --tb=short -k "not dat_ingest"

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./v2/backend
          fail_ci_if_error: false
