name: Security Scan

# Security Audit 2025-01: Container and dependency vulnerability scanning
# Refs:
# - https://github.com/shieldfy/API-Security-Checklist
# - https://github.com/The-Art-of-Hacking/h4cker

on:
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches:
      - main
    # No path filters on PR: required security checks must always run
    # to avoid "Expected check missing" in branch protection.
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ================================================================
  # Job 1: Python Dependency Vulnerability Scan
  # ================================================================
  python-security:
    name: "[required] Python Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install "safety>=3,<4" bandit pip-audit

      - name: Run Safety scan (modern CLI, complementary)
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          set -euo pipefail
          cd v2/backend

          if [ -n "${SAFETY_API_KEY:-}" ]; then
            set +e
            safety --key "$SAFETY_API_KEY" scan --target . --output json > safety-report.json
            safety_exit=$?
            set -e

            if [ "$safety_exit" -ne 0 ]; then
              echo "Safety scan exit=${safety_exit}; pip-audit remains the blocking CVE gate."
            fi
          else
            printf '%s\n' '{"tool":"safety","mode":"scan","status":"skipped","reason":"SAFETY_API_KEY not configured"}' > safety-report.json
            echo "Safety scan skipped: SAFETY_API_KEY not configured. pip-audit remains blocking."
          fi

          if [ ! -s safety-report.json ]; then
            printf '%s\n' '{"tool":"safety","mode":"scan","status":"error","reason":"empty report output"}' > safety-report.json
          fi

      - name: Run pip-audit (PyPI Advisory Database)
        run: |
          cd v2/backend
          # Temporary exception: CVE-2026-4539 (pygments) currently has no upstream fixed version.
          pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539 --format json > pip-audit-report.json

      - name: Run Bandit (SAST)
        run: |
          cd v2/backend
          bandit -r apps/ -f json -o bandit-report.json --skip B101,B601 -ll

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-security-reports
          path: |
            v2/backend/safety-report.json
            v2/backend/pip-audit-report.json
            v2/backend/bandit-report.json

  # ================================================================
  # Job 2: Container Image Vulnerability Scan (Trivy)
  # ================================================================
  container-security:
    name: "[required] Container Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build backend image
        run: |
          cd v2
          docker build -f infra/Dockerfile.prod -t aprender-backend:scan .

      - name: Build frontend image
        run: |
          docker build -f v2/frontend/Dockerfile.prod -t aprender-frontend:scan v2/frontend

      - name: Run Trivy (backend JSON report)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: 'aprender-backend:scan'
          format: 'json'
          output: 'trivy-backend-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy (frontend JSON report)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: 'aprender-frontend:scan'
          format: 'json'
          output: 'trivy-frontend-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Enforce unified container security gate (HIGH/CRITICAL)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          reports = {
              "backend": Path("trivy-backend-report.json"),
              "frontend": Path("trivy-frontend-report.json"),
          }

          def count_blocking(path: Path) -> int:
              data = json.loads(path.read_text(encoding="utf-8"))
              total = 0
              for result in data.get("Results", []) or []:
                  for vuln in result.get("Vulnerabilities", []) or []:
                      if vuln.get("Severity") in {"HIGH", "CRITICAL"}:
                          total += 1
              return total

          counts = {name: count_blocking(path) for name, path in reports.items()}
          total_blocking = sum(counts.values())

          summary = (
              "# Container Scan Summary\n\n"
              "| Image | HIGH/CRITICAL |\n"
              "|---|---:|\n"
              f"| backend | {counts['backend']} |\n"
              f"| frontend | {counts['frontend']} |\n"
              f"| **total** | **{total_blocking}** |\n"
          )

          Path("trivy-summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_step_summary:
              with Path(github_step_summary).open("a", encoding="utf-8") as fp:
                  fp.write(summary + "\n")

          if total_blocking > 0:
              print(
                  f"Container security gate failed: found {total_blocking} HIGH/CRITICAL vulnerabilities.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-backend-report.json
            trivy-frontend-report.json
            trivy-summary.md

  # ================================================================
  # Job 3: Frontend Dependency Scan
  # ================================================================
  frontend-security:
    name: "[required] Frontend Dependencies"
    # npm audit de dependências de produção é workload leve de CPU.
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd v2/frontend
          npm ci

      - name: Run npm audit
        run: |
          set -euo pipefail
          cd v2/frontend
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running npm audit (prod-only) attempt ${attempt}/${max_attempts}"
            rm -f npm-audit-report.json npm-audit-stderr.log

            set +e
            npm audit --omit=dev --json > npm-audit-report.json 2>npm-audit-stderr.log
            audit_exit=$?
            set -e

            if [ ! -s npm-audit-report.json ]; then
              parse_exit=2
            else
              set +e
              node -e 'const fs=require("fs"); let report; try {report=JSON.parse(fs.readFileSync("npm-audit-report.json","utf8"));} catch {process.exit(2);} if (report?.metadata?.vulnerabilities) {const high=Number(report.metadata.vulnerabilities.high||0); const critical=Number(report.metadata.vulnerabilities.critical||0); console.log(`npm audit (prod) high=${high} critical=${critical}`); process.exit(high+critical>0?10:0);} if (report?.error){console.log(`npm audit reported API error: ${report.error.summary || report.error.message || "unknown"}`); process.exit(3);} process.exit(2);'
              parse_exit=$?
              set -e
            fi

            if [ "$parse_exit" -eq 0 ]; then
              echo "Production dependency audit gate passed."
              exit 0
            fi

            if [ "$parse_exit" -eq 10 ]; then
              echo "Production dependency audit gate failed: HIGH/CRITICAL vulnerability found." >&2
              exit 1
            fi

            # Retry only on known transient npm audit endpoint/tree errors.
            if grep -qiE "Invalid package tree|audit endpoint returned an error|Bad Request|EAI_AGAIN|ETIMEDOUT|ECONNRESET|ENOTFOUND|5[0-9]{2}" npm-audit-stderr.log; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient npm audit endpoint/tree error detected; retrying..."
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi

              echo "npm audit failed after ${max_attempts} attempts due endpoint/tree errors." >&2
              cat npm-audit-stderr.log >&2 || true
              exit 1
            fi

            echo "npm audit failed with non-retryable error (audit_exit=${audit_exit}, parse_exit=${parse_exit})." >&2
            cat npm-audit-stderr.log >&2 || true
            if [ -s npm-audit-report.json ]; then
              cat npm-audit-report.json >&2 || true
            fi
            exit 1
          done

      - name: Upload npm audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-report
          path: |
            v2/frontend/npm-audit-report.json
            v2/frontend/npm-audit-stderr.log

  # ================================================================
  # Job 4: Secret Scanning
  # ================================================================
  secrets-scan:
    name: "[required] Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Install TruffleHog CLI
        run: |
          set -euo pipefail
          TRUFFLEHOG_VERSION=3.93.4
          url="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o trufflehog.tar.gz
          tar -xzf trufflehog.tar.gz trufflehog
          chmod +x trufflehog
          sudo mv trufflehog /usr/local/bin/trufflehog

      - name: Determine Gitleaks scan range
        id: gitleaks-range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--since=168h" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine TruffleHog scan range
        id: trufflehog-range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "since=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "since=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled runs: bounded scan depth to keep runtime predictable.
            echo "mode=depth" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --redact \
            --log-opts "${{ steps.gitleaks-range.outputs.log_opts }}" \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

      - name: Run TruffleHog
        run: |
          set -euo pipefail
          if [ "${{ steps.trufflehog-range.outputs.mode }}" = "range" ]; then
            trufflehog git "file://." \
              --since-commit "${{ steps.trufflehog-range.outputs.since }}" \
              --branch "${{ steps.trufflehog-range.outputs.head }}" \
              --results=verified \
              --fail \
              --no-update \
              --json > trufflehog-report.json
          else
            trufflehog git "file://." \
              --branch "${{ steps.trufflehog-range.outputs.head }}" \
              --max-depth 400 \
              --results=verified \
              --fail \
              --no-update \
              --json > trufflehog-report.json
          fi

      - name: Upload secret scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan-reports
          path: |
            gitleaks-report.json
            trufflehog-report.json
