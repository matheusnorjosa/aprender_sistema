name: Security Scan

# Security Audit 2025-01: Container and dependency vulnerability scanning
# Refs:
# - https://github.com/shieldfy/API-Security-Checklist
# - https://github.com/The-Art-of-Hacking/h4cker

on:
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ================================================================
  # Job 1: Python Dependency Vulnerability Scan
  # ================================================================
  python-security:
    name: Python Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install safety bandit pip-audit

      - name: Run Safety (CVE check)
        run: |
          cd v2/backend
          safety check -r requirements.txt --output json > safety-report.json

      - name: Run pip-audit (PyPI Advisory Database)
        run: |
          cd v2/backend
          pip-audit -r requirements.txt --format json > pip-audit-report.json

      - name: Run Bandit (SAST)
        run: |
          cd v2/backend
          bandit -r apps/ -f json -o bandit-report.json --skip B101,B601 -ll

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-security-reports
          path: |
            v2/backend/safety-report.json
            v2/backend/pip-audit-report.json
            v2/backend/bandit-report.json

  # ================================================================
  # Job 2: Container Image Vulnerability Scan (Trivy)
  # ================================================================
  container-security:
    name: Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: |
          cd v2
          docker build -f infra/Dockerfile -t aprender-backend:scan .

      - name: Run Trivy (JSON report)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: 'aprender-backend:scan'
          format: 'json'
          output: 'trivy-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy vulnerability scanner (blocking HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          image-ref: 'aprender-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  # ================================================================
  # Job 3: Frontend Dependency Scan
  # ================================================================
  frontend-security:
    name: Frontend Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd v2/frontend
          npm ci

      - name: Run npm audit
        run: |
          set -euo pipefail
          cd v2/frontend
          set +e
          npm audit --json > npm-audit-report.json
          json_exit_code=$?
          set -e
          if [ ! -s npm-audit-report.json ]; then
            echo "npm-audit-report.json not generated" >&2
            exit 1
          fi
          if [ "$json_exit_code" -ne 0 ]; then
            echo "npm audit JSON reported issues/errors (captured for artifact)"
          fi
          # Gate only production dependencies in PR CI.
          npm audit --omit=dev --audit-level=high

      - name: Upload npm audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-report
          path: v2/frontend/npm-audit-report.json

  # ================================================================
  # Job 4: Secret Scanning
  # ================================================================
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Determine Gitleaks scan range
        id: gitleaks-range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--since=168h" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --redact \
            --log-opts "${{ steps.gitleaks-range.outputs.log_opts }}" \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@7c0734f987ad0bb30ee8da210773b800ee2016d3 # v3.93.4
        with:
          extra_args: --only-verified

      - name: Upload secret scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan-reports
          path: |
            gitleaks-report.json
