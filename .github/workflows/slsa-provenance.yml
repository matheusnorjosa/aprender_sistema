name: SLSA Provenance and Signing

on:
  # Chamado pelo deploy.yaml (job `sign`) após o build+push — auto-assinatura de
  # toda release de prod (ADR-018 #1524). Reusable LOCAL => identidade keyless
  # continua slsa-provenance.yml@refs/heads/main (o agente/promote nao mudam).
  workflow_call:
    inputs:
      release_tag:
        description: "Tag imutável já buildada e pushada (vYYYY.MM.DD-<sha7>)"
        required: true
        type: string
      backend_digest:
        description: "Digest do backend (sha256:...) — evita TOCTOU de tag mutável"
        required: false
        type: string
        default: ""
      frontend_digest:
        description: "Digest do frontend (sha256:...)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag imutável para atestar/assinar (ex: v2026.03.20-abc1234)"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: slsa-${{ github.event_name }}-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

jobs:
  provenance-signing:
    name: "[ops] slsa provenance + cosign"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Resolve release tag
        id: resolve
        env:
          # inputs.* cobre workflow_call E workflow_dispatch; release usa o evento.
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          release_tag="$(echo "${RELEASE_TAG_INPUT}" | xargs)"
          if [ -z "$release_tag" ]; then release_tag="$(echo "${RELEASE_TAG_EVENT}" | xargs)"; fi

          if [ -z "$release_tag" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi

          if [ "$release_tag" = "latest" ]; then
            echo "Invalid tag 'latest'. Use immutable tag vYYYY.MM.DD-<sha-or-id>." >&2
            exit 1
          fi

          if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9A-Za-z._-]+$'; then
            echo "Invalid tag format: $release_tag. Expected vYYYY.MM.DD-<sha-or-id>." >&2
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Resolve image digests
        id: digests
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          # Digests passados pelo caller (deploy.yaml) evitam TOCTOU de tag mutavel.
          # Fallback: resolve por tag (backfill via workflow_dispatch/release). Mesmo
          # metodo (imagetools inspect) que o gate-duro do promote.yml usa.
          BACKEND_DIGEST_IN: ${{ inputs.backend_digest || '' }}
          FRONTEND_DIGEST_IN: ${{ inputs.frontend_digest || '' }}
        run: |
          set -euo pipefail

          # Mesma flake do promote.yml: o Docker Hub devolve exit 255 esporadico com a
          # imagem existindo. Retry com backoff; fail-closed ao esgotar. Diagnostico em
          # stderr (o stdout desta funcao e capturado por $( )).
          resolve_digest() {
            local ref="$1" attempt rc out digest
            for attempt in 1 2 3 4 5; do
              rc=0; out="$(docker buildx imagetools inspect "$ref" 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ]; then
                digest="$(printf '%s\n' "$out" | awk '/Digest:/ {print $2; exit}')"
                if printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                  printf '%s' "$digest"; return 0
                fi
                echo "aviso: ${ref}: digest ausente/invalido (tentativa ${attempt})" >&2
              else
                echo "aviso: ${ref}: imagetools inspect saiu ${rc} (tentativa ${attempt})" >&2
              fi
              printf '%s\n' "$out" >&2
              if [ "$attempt" -lt 5 ]; then sleep "$(( attempt * 5 ))"; fi
            done
            echo "${ref}: digest nao resolvido apos 5 tentativas" >&2
            return 1
          }

          be="$BACKEND_DIGEST_IN"; fe="$FRONTEND_DIGEST_IN"
          if [ -z "$be" ] || [ -z "$fe" ]; then
            be="$(resolve_digest "${BACKEND_IMAGE}:${RELEASE_TAG}")"
            fe="$(resolve_digest "${FRONTEND_IMAGE}:${RELEASE_TAG}")"
          fi
          for d in "$be" "$fe"; do
            printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "digest invalido: $d" >&2; exit 1; }
          done
          {
            echo "backend_ref=${BACKEND_IMAGE}:${RELEASE_TAG}"
            echo "frontend_ref=${FRONTEND_IMAGE}:${RELEASE_TAG}"
            echo "backend_digest=${be}"
            echo "frontend_digest=${fe}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation (backend)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # registry-qualified (index.docker.io/): sem o prefixo o attest interpreta
          # 'norjosamatheus' como host de registry -> "No credentials found for registry".
          subject-name: index.docker.io/${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.digests.outputs.backend_digest }}
          push-to-registry: true

      - name: Generate SLSA provenance attestation (frontend)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: index.docker.io/${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.digests.outputs.frontend_digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images with keyless Cosign
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          cosign sign --yes "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Verify Cosign signatures
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
          CERT_IDENTITY_REGEX: ^https://github.com/${{ github.repository }}/.github/workflows/slsa-provenance.yml@refs/(heads/main|tags/.+)$
        run: |
          set -euo pipefail
          cosign verify "${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEX}" \
            > cosign-verify-backend.json

          cosign verify "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEX}" \
            > cosign-verify-frontend.json

      - name: Verify provenance attestations
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/slsa-provenance.yml
          GH_TOKEN: ${{ github.token }}   # gh attestation verify precisa de auth (self-check)
        run: |
          set -euo pipefail
          gh attestation verify "oci://${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --bundle-from-oci \
            --format json \
            > attestation-verify-backend.json

          gh attestation verify "oci://${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --bundle-from-oci \
            --format json \
            > attestation-verify-frontend.json

      - name: Build supply chain summary
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          {
            echo "# SLSA Provenance + Cosign"
            echo
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Backend: \`${BACKEND_IMAGE}@${BACKEND_DIGEST}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}@${FRONTEND_DIGEST}\`"
            echo "- Attestation predicate: \`https://slsa.dev/provenance/v1\`"
            echo "- Signer workflow: \`${GITHUB_REPOSITORY}/.github/workflows/slsa-provenance.yml\`"
          } | tee slsa-summary.md

          cat slsa-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SLSA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: slsa-provenance-${{ github.run_id }}
          path: |
            slsa-summary.md
            cosign-verify-backend.json
            cosign-verify-frontend.json
            attestation-verify-backend.json
            attestation-verify-frontend.json
          if-no-files-found: error
          retention-days: 30
