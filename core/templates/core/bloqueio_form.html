<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Inclusão de bloqueio de agenda</title></head>
  <body>
    <h2>Inclusão de bloqueio de agenda</h2>
    <p>Informe o formador, a data de início e fim. Para apenas um dia, repita a mesma data.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <table>
        {{ form.as_table }}
      </table>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
