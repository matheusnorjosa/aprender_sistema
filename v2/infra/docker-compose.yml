name: aprender_v2
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # CP2: Redis persistence com RDB snapshots
    # save 60 1 = snapshot a cada 60s se houver >= 1 mudança
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
  web:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: gunicorn config.wsgi:application --config /app/infra/gunicorn.conf.py
    env_file: .env
    environment:
      # ================================================================
      # Environment & Security (CP-01)
      # ================================================================
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-False}
      REQUIRE_DOCKER: 1
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      SERVICE_NAME: web

      # ================================================================
      # Session Configuration (2 hours timeout)
      # ================================================================
      SESSION_COOKIE_AGE: 7200
      SESSION_COOKIE_NAME: asv2sid
      SESSION_SAVE_EVERY_REQUEST: "True"
      SESSION_EXPIRE_AT_BROWSER_CLOSE: "True"

      # ================================================================
      # Security: Account Lockout (Security Audit 2025)
      # ================================================================
      ACCOUNT_LOCKOUT_THRESHOLD: 10
      ACCOUNT_LOCKOUT_DURATION: 900

      # ================================================================
      # Business Rules (RD-04, RD-05)
      # ================================================================
      AVAILABILITY_DAILY_LIMIT_HOURS: ${AVAILABILITY_DAILY_LIMIT_HOURS:-8}
      TRAVEL_BUFFER_MINUTES: ${TRAVEL_BUFFER_MINUTES:-60}

      # ================================================================
      # Feature Flags
      # ================================================================
      FEATURE_AUTO_APPLY_ENABLED: ${FEATURE_AUTO_APPLY_ENABLED:-False}
      GCAL_CLIENT: ${GCAL_CLIENT:-fake}

      # ================================================================
      # Gunicorn Configuration (CP1 - Performance Optimization)
      # ================================================================
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
    depends_on:
      - db
      - redis
    ports:
      - "8002:8000"
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
      - backup_data:/backups # MP5: Database backups storage
      - ./scripts:/app/infra/scripts:ro # MP5: Backup scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/readyz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    environment:
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-False}
      REQUIRE_DOCKER: 1
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      SERVICE_NAME: worker
      # Feature Flags
      FEATURE_AUTO_APPLY_ENABLED: ${FEATURE_AUTO_APPLY_ENABLED:-False}
      GCAL_CLIENT: ${GCAL_CLIENT:-fake}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
      - backup_data:/backups # MP5: Database backups storage (C-05)
      - ./scripts:/app/infra/scripts:ro # MP5: Backup scripts (C-05)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  beat:
    image: norjosamatheus/aprender-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A config beat -l info
    env_file: .env
    environment:
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-False}
      REQUIRE_DOCKER: 1
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      SERVICE_NAME: beat
      # Feature Flags
      FEATURE_AUTO_APPLY_ENABLED: ${FEATURE_AUTO_APPLY_ENABLED:-False}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ../data/csv-import:/app/data/csv-import:ro
      - backup_data:/backups # MP5: Database backups storage (C-05)
      - ./scripts:/app/infra/scripts:ro # MP5: Backup scripts (C-05)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import celery; print(celery.__version__)' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: norjosamatheus/aprender-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      PROXY_TARGET: http://web:8000 # Proxy server-side para o backend interno
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src:ro # Hot reload do código fonte
      - ../frontend/public:/app/public:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Runner canônico para E2E (Issue #615):
  # usa imagem oficial do Playwright com browsers + deps pré-instalados.
  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    working_dir: /work
    environment:
      CI: "1"
      E2E_DOCKER: "1"
      PROXY_TARGET: "http://web:8000"
      VITE_API_URL: "/api"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    volumes:
      - ../frontend:/work
    depends_on:
      - web

  # ================================================================
  # Observability Stack (Prometheus + Grafana + Exporters)
  # ================================================================
  # Movido para docker-compose.observability.yml (Issue #234)
  #
  # Para usar localmente:
  #   make up-obs
  # Ou:
  #   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
  #
  # Em produção, use o serviço de observabilidade do provedor.
  # O endpoint /metrics do Django permanece disponível para scraping.
  # ================================================================

volumes:
  db_data:
  redis_data: # CP2: Persistência Redis (sessões)
  backup_data: # MP5: PostgreSQL backups storage
