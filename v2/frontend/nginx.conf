# =============================================================================
# Nginx Configuration for Aprender Sistema Frontend
# =============================================================================

# INFRA-03: Rate limiting zones (defense-in-depth beyond Django throttling)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — re-resolves on every request so that
    # container IP changes after redeploy are picked up automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression (aggressive for SPA assets)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml application/wasm font/woff2;

    # Security headers — M27-24 (#1647): num snippet reincluído em cada location
    # com add_header próprio (a herança do nginx descarta os do server quando a
    # location declara qualquer add_header).
    include /etc/nginx/security-headers.conf;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;  # M27-24: re-herda os headers
    }

    # SEC-RECON-02: /metrics removed from public proxy.
    # Prometheus scrapes directly via Docker network (web:8000/metrics).
    location = /metrics  { return 404; }
    location   /metrics/ { return 404; }

    # Source maps must never be served in production (leaks source).
    # Regex location wins over the plain /assets/ prefix match.
    location ~* \.map$ {
        return 404;
        access_log off;
    }

    # Hashed static assets — immutable long cache (Vite adds content hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;  # M27-24: re-herda os headers
        try_files $uri =404;
    }

    # Other static assets (icons, images, fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.conf;  # M27-24: re-herda os headers
        try_files $uri =404;
    }

    # API proxy (reverse proxy to backend)
    # INFRA-03: rate limiting at nginx layer (burst=50 allows short spikes)
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # #1671: Django admin — proxy ao backend, senao /admin/ cai no catch-all do SPA
    # e vira index.html. O admin_site e superuser-only por construcao; expor a rota
    # nao afrouxa a auth (o Django segue exigindo login + is_superuser).
    location /admin/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # #1671: estaticos do Django (CSS/JS do admin) servidos pelo whitenoise no
    # backend. Sem esta rota, /static/* cai no SPA (devolve index.html) e o admin
    # sobe sem estilo/JS — quebrando o filter_horizontal usado para Group x Capability.
    location /static/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # SPA fallback - serve index.html for all routes
    # no-cache ensures browser always checks for new version after deploy
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;  # M27-24: re-herda os headers na rota SPA
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
