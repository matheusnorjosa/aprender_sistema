# ================================================================
# Prometheus Configuration - AS v2 (MP1)
# ================================================================
# Collects metrics from:
# - Django web/worker/beat (django-prometheus)
# - PostgreSQL (postgres_exporter)
# - Redis (redis_exporter)
# - Prometheus itself (self-monitoring)
# ================================================================

global:
  scrape_interval: 15s  # Scrape every 15s
  evaluation_interval: 15s  # Evaluate rules every 15s
  scrape_timeout: 10s  # Timeout after 10s

  external_labels:
    environment: '${ENVIRONMENT:-development}'
    project: 'aprender_sistema_v2'

# Scrape configurations
scrape_configs:
  # ================================================================
  # Django Web Application (Gunicorn)
  # ================================================================
  - job_name: 'django_web'
    static_configs:
      - targets: ['web:8000']
        labels:
          service: 'django'
          component: 'web'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ================================================================
  # Django Celery Worker
  # ================================================================
  # Note: Worker needs to expose metrics via separate HTTP server
  # For now, workers share same metrics endpoint through django_prometheus
  # In production, consider using flower or celery-prometheus-exporter
  - job_name: 'django_worker'
    static_configs:
      - targets: []  # TODO: Add worker metrics endpoint if using flower
        labels:
          service: 'django'
          component: 'worker'
    scrape_interval: 30s

  # ================================================================
  # Django Celery Beat
  # ================================================================
  - job_name: 'django_beat'
    static_configs:
      - targets: []  # TODO: Add beat metrics endpoint if needed
        labels:
          service: 'django'
          component: 'beat'
    scrape_interval: 60s

  # ================================================================
  # PostgreSQL Database (via postgres_exporter)
  # ================================================================
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          service: 'postgresql'
          component: 'database'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ================================================================
  # Redis Cache (via redis_exporter)
  # ================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ================================================================
  # Prometheus Self-Monitoring
  # ================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'
    metrics_path: '/metrics'
    scrape_interval: 30s
