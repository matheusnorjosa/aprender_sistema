name: Docs Quality

# Gate de qualidade da documentação viva (modelo SDD / ADR-017):
#  - links relativos quebrados em docs/ + v2/docs/ (exceto _archive)
#  - frontmatter (status + last_verified) das specs em v2/docs/specs/
# Complementa o `mkdocs build --strict` (docs.yml), que cobre só a árvore docs/.

on:
  # NOTE: SEM path filter de propósito. Este é um check [required] no ruleset da main,
  # então PRECISA sempre reportar status — com path filter, um PR que não toca docs/**
  # deixaria o check "Expected/pending" eterno e travaria o merge (trap clássico de
  # required + path filter no GitHub). Os 2 scripts rodam em segundos e validam toda a
  # árvore docs/ + v2/docs viva de qualquer forma (não são incrementais).
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-quality:
    name: "[required] docs quality (links + frontmatter)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          # `check_agent_instructions.py --tracked-only` chama `git ls-files`.
          # Checkout raso (depth=1) faria o gate passar por falta de dado, que e
          # o modo de falha que este plano existe para eliminar.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.12'

      - name: Links relativos quebrados (docs vivos)
        run: python scripts/check_doc_links.py

      - name: Frontmatter das specs SDD
        run: python scripts/check_doc_frontmatter.py

      # A camada de instrucao de agente (.claude/, .agents/) passou a ser
      # versionada em 2026-08-25 (D3). Num repo publico isso cria risco de
      # caminho de maquina e credencial entrarem por descuido. Este gate impede
      # a reincidencia; `--tracked-only` limita ao que o git rastreia, para nao
      # acusar settings.local.json, que fica fora do git de proposito.
      - name: Instrucao de agente sem caminho de maquina nem credencial
        run: >
          python v2/backend/scripts/check_agent_instructions.py
          --tracked-only .claude .agents AGENTS.md CLAUDE.md

      # POR QUE ESTE STEP EXISTE.
      # .claude/hooks/test_hooks.py tem 51 casos cobrindo os guards (47 aqui: os 4
      # de hook .ps1 sao pulados, com aviso, porque o runner nao tem powershell) — inclusive
      # a CP-07 — e NUNCA rodou em CI: mora fora do `testpaths = apps` do pytest.
      # Consequencia medida: o PR #1847 trocou os caminhos dos hooks para
      # $CLAUDE_PROJECT_DIR, o harness usava os.path.isabs() e passou a reprovar
      # 8 testes de wiring e a PULAR EM SILENCIO os 2 de runtime do guardrails.
      # Ficou 41/49 e mergeou assim. Um harness que ninguem roda nao protege nada.
      # Sem dependencia externa: so json + os da stdlib.
      #
      # `!cancelled()`: sem isto, a falha deste step PULA o gate de doc viva abaixo
      # e o diagnostico chega pela metade -- foi o que aconteceu na primeira
      # execucao deste workflow. Cada gate reporta por si.
      - name: Harness dos hooks de agente (guards CP-05/CP-07)
        if: ${{ !cancelled() }}
        run: python .claude/hooks/test_hooks.py

      # Mantem a documentacao viva. Dois detectores com calibragem diferente:
      # issue resolvida cujo doc a cita BLOQUEIA (preciso e raro); codigo alterado
      # que uma spec declara em sources_of_truth AVISA (dispara em ~60% dos PRs).
      # Medido contra os 12 ultimos merges: 0 bloqueios, media de 1,7 avisos.
      # Escopo resolvido DENTRO do job — nunca por path filter, que e o trap
      # documentado no topo deste arquivo.
      - name: Documentacao viva (issue resolvida e spec impactada)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          # `...` (merge-base) e nao `..`: com `..` o diff carrega o que entrou na
          # main depois do branch, e o PR responde por mudanca alheia.
          python v2/backend/scripts/check_doc_impact.py \
            --range "${BASE_SHA}...${HEAD_SHA}" \
            --pr-body-file /tmp/pr-body.txt
