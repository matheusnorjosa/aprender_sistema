name: Security Scan

# Security Audit 2025-01: Container and dependency vulnerability scanning
# Refs:
# - https://github.com/shieldfy/API-Security-Checklist
# - https://github.com/The-Art-of-Hacking/h4cker

on:
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v2/**'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  # ================================================================
  # Job 1: Python Dependency Vulnerability Scan
  # ================================================================
  python-security:
    name: Python Dependencies
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install safety bandit pip-audit

      - name: Run Safety (CVE check)
        continue-on-error: true
        run: |
          cd v2/backend
          safety check -r requirements.txt --output json > safety-report.json || true
          safety check -r requirements.txt

      - name: Run pip-audit (PyPI Advisory Database)
        continue-on-error: true
        run: |
          cd v2/backend
          pip-audit -r requirements.txt --format json > pip-audit-report.json || true
          pip-audit -r requirements.txt

      - name: Run Bandit (SAST)
        continue-on-error: true
        run: |
          cd v2/backend
          bandit -r apps/ -f json -o bandit-report.json --skip B101,B601 || true
          bandit -r apps/ --skip B101,B601 -ll

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            v2/backend/safety-report.json
            v2/backend/pip-audit-report.json
            v2/backend/bandit-report.json

  # ================================================================
  # Job 2: Container Image Vulnerability Scan (Trivy)
  # ================================================================
  container-security:
    name: Container Scan
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd v2
          docker build -f infra/Dockerfile -t aprender-backend:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aprender-backend:scan'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities (just report)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy (JSON report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aprender-backend:scan'
          format: 'json'
          output: 'trivy-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  # ================================================================
  # Job 3: Frontend Dependency Scan
  # ================================================================
  frontend-security:
    name: Frontend Dependencies
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd v2/frontend
          npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          cd v2/frontend
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: v2/frontend/npm-audit-report.json

  # ================================================================
  # Job 4: Secret Scanning
  # ================================================================
  secrets-scan:
    name: Secret Detection
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --only-verified
