name: Backend xdist Canary (non-blocking)

on:
  schedule:
    # Semanal (segunda 10:20 UTC); antes era diario. A estabilizacao xdist ja esta
    # consolidada ha semanas; o trigger `push` cobre o caso importante (codigo novo
    # introduzindo flakiness), e o cron semanal cobre o de fundo (flaky por tempo).
    - cron: "20 10 * * 1"
  workflow_dispatch:
    inputs:
      extra_pytest_args:
        description: "Optional extra pytest args (example: -k test_config_validation)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/backend-xdist-canary.yml"
      - ".github/workflows/_backend-test.yml"
      - "v2/scripts/xdist_canary_report.py"
      - "docs/operations/ci-backend-xdist-canary.md"
      - "docs/operations/ci-backend-xdist-stabilization-backlog.md"
      - "docs/operations/ci-check-policy.md"

permissions:
  # `issues: write` movido p/ o job canary-report (unico que comenta na issue);
  # o job de matriz de testes herda so `contents: read`. #1397.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xdist-canary:
    name: "[info] backend xdist canary (w=${{ matrix.workers }},dist=${{ matrix.dist }})"
    strategy:
      fail-fast: false
      matrix:
        workers: ["2", "auto"]
        dist: ["loadscope", "loadfile"]
    # Setup (services/env/migrate/dirs) centralizado no reusable; matrix fica aqui no
    # caller e passa workers/dist via inputs. #1401.
    uses: ./.github/workflows/_backend-test.yml
    with:
      runner_timeout: 40
      pytest_paths: apps
      pytest_extra_args: >-
        -n ${{ matrix.workers }} --dist ${{ matrix.dist }} --max-worker-restart=0
        --junitxml=xdist-canary-junit.xml ${{ github.event.inputs.extra_pytest_args || '' }}
      summary_title: xdist canary run
      capture_log_file: xdist-canary-pytest.log
      # non-blocking: falhas xdist vivem no report/issue #677, job segue verde (#1401).
      fail_on_test_error: false
      emit_canary_metadata: true
      matrix_workers: ${{ matrix.workers }}
      matrix_dist: ${{ matrix.dist }}
      artifact_name: xdist-canary-${{ matrix.workers }}w-${{ matrix.dist }}
      artifact_paths: |
        v2/backend/xdist-canary-pytest.log
        v2/backend/xdist-canary-junit.xml
        v2/backend/xdist-canary-metadata.json
      artifact_if_no_files: warn
      artifact_retention_days: 30

  canary-report:
    name: "[ops] backend xdist canary summary"
    runs-on: ubuntu-latest
    permissions:
      # Unico job que comenta na issue 677 — issues:write vive aqui. #1397.
      contents: read
      issues: write
    needs:
      - xdist-canary
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Download xdist canary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: xdist-canary-*
          path: xdist-canary-artifacts
          digest-mismatch: warn

      - name: Build consolidated canary report
        run: |
          python v2/scripts/xdist_canary_report.py \
            --artifacts-dir xdist-canary-artifacts \
            --output-json xdist-canary-report.json \
            --output-md xdist-canary-report.md

      - name: Upload consolidated report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xdist-canary-report
          path: |
            xdist-canary-report.json
            xdist-canary-report.md
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          if [ -f xdist-canary-report.md ]; then
            cat xdist-canary-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "xdist-canary-report.md not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish evidence snapshot to issue #677 (somente em falha)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f xdist-canary-report.json ]; then
            echo "xdist-canary-report.json not found; skipping issue comment."
            exit 0
          fi

          # Alerta so quando importa: comenta no #677 SO se houve falha xdist. Run limpo
          # (0 falhas) nao comenta -> evita fadiga de alerta (email diario de "0 failures").
          # A evidencia limpa continua no step summary + artifact (retencao 30d); o #677 vira
          # um log de FLAKY REAL, com significado.
          FAILS=$(python -c "import json; print(json.load(open('xdist-canary-report.json')).get('runs_with_failures', 0))")
          if [ "$FAILS" = "0" ]; then
            echo "xdist canary: 0 runs com falha -> nao comenta no #677 (evidencia limpa fica no summary/artifact)."
            exit 0
          fi

          python - <<'PY' > /tmp/xdist_issue_677_comment.md
          import json
          import os
          from datetime import datetime, timezone

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}" if repo and run_id else ""
          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          with open("xdist-canary-report.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          def _top(items, key, limit=5):
              result = []
              for item in items[:limit]:
                  label = item.get(key, "unknown")
                  count = item.get("count", 0)
                  result.append(f"- `{label}`: {count} run(s)")
              if not result:
                  result.append("- none")
              return result

          lines = []
          lines.append("### xdist canary evidence snapshot")
          lines.append("")
          lines.append(f"- Timestamp: `{now_utc}`")
          if run_url:
              lines.append(f"- Workflow run: {run_url}")
          lines.append(f"- Matrix runs: `{report.get('runs_total', 0)}`")
          lines.append(f"- Runs with failures: `{report.get('runs_with_failures', 0)}`")
          lines.append(f"- Runs without failures: `{report.get('runs_without_failures', 0)}`")
          lines.append("- Backlog tracking: `docs/operations/ci-backend-xdist-stabilization-backlog.md`")
          lines.append("")
          lines.append("Top recurrent failed tests:")
          lines.extend(_top(report.get("recurrent_failed_tests", []), "test_id"))
          lines.append("")
          lines.append("Top failure signatures:")
          lines.extend(_top(report.get("recurrent_failure_signatures", []), "signature"))

          print("\n".join(lines))
          PY

          gh issue comment 677 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/xdist_issue_677_comment.md
