name: V2 CI

on:
  push:
    branches:
      - rebuild/2025-contexto-supremo
      - main-v1
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches:
      - main-v1
    paths:
      - 'v2/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_aprender
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'v2/backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt
          pip install black isort flake8 pytest pytest-django pytest-cov

      - name: Lint with Black
        run: |
          cd v2/backend
          black --check --diff .

      - name: Lint with isort
        run: |
          cd v2/backend
          isort --check-only --diff .

      - name: Lint with Flake8
        run: |
          cd v2/backend
          flake8 --max-line-length=120 --extend-ignore=E203,W503 .

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "0"
          DB_NAME: test_aprender
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TZ: America/Fortaleza
          REQUIRE_DOCKER: "0"
          GCAL_CLIENT: fake
          GCAL_SEND_UPDATES: none
          FEATURE_AUTO_APPLY_ENABLED: "false"
          ETL_OUTPUT_DIR: ${{ github.workspace }}/v2/backend/out_etl
          ETL_DATA_DIR: ${{ github.workspace }}/v2/backend/data/csv-import
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd v2/backend
          python manage.py check --deploy

      - name: Run Migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "0"
          DB_NAME: test_aprender
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TZ: America/Fortaleza
          REQUIRE_DOCKER: "0"
          GCAL_CLIENT: fake
          GCAL_SEND_UPDATES: none
          FEATURE_AUTO_APPLY_ENABLED: "false"
          ETL_OUTPUT_DIR: ${{ github.workspace }}/v2/backend/out_etl
          ETL_DATA_DIR: ${{ github.workspace }}/v2/backend/data/csv-import
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd v2/backend
          python manage.py migrate --noinput

      - name: Prepare runtime dirs and symlinks
        run: |
          sudo mkdir -p /app
          # garantir diretórios no workspace
          mkdir -p "$GITHUB_WORKSPACE/v2/backend/.agents/outbox"
          # apontar /app/.agents -> workspace/.agents
          sudo rm -rf /app/.agents || true
          sudo ln -s "$GITHUB_WORKSPACE/v2/backend/.agents" /app/.agents
          # opcional: ETL dirs também
          mkdir -p "$GITHUB_WORKSPACE/v2/backend/out_etl"
          mkdir -p "$GITHUB_WORKSPACE/v2/backend/data/csv-import"

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "0"
          DB_NAME: test_aprender
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TZ: America/Fortaleza
          REQUIRE_DOCKER: "0"
          GCAL_CLIENT: fake
          GCAL_SEND_UPDATES: none
          FEATURE_AUTO_APPLY_ENABLED: "false"
          ETL_OUTPUT_DIR: ${{ github.workspace }}/v2/backend/out_etl
          ETL_DATA_DIR: ${{ github.workspace }}/v2/backend/data/csv-import
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd v2/backend
          # Quarentena removida - #39 resolvido via PR #44
          pytest -q --tb=short

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./v2/backend
          fail_ci_if_error: false
