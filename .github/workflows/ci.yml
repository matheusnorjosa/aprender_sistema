name: 🔍 Sistema Aprender - CI/CD Pipeline

on:
  push:
    branches: [ main, homolog, develop ]
  pull_request:
    branches: [ main, homolog, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  POSTGRES_VERSION: '15'

jobs:
  # ===== ANÁLISE E QUALIDADE =====
  code-quality:
    name: 📊 Análise de Código
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🎯 Format check (Black)
      run: black --check --diff .

    - name: 📐 Import sorting (isort)
      run: isort --check-only --diff .

    - name: 🕵️ Linting (Flake8)
      run: flake8

    - name: 🔒 Security scan (Bandit)
      run: bandit -r . -x "/venv/,/tests/,/migrations/" -ll

    - name: 🛡️ Dependency check (Safety)
      run: safety check --ignore 70612

  # ===== ANTI-REGRESSION GATE (HOTFIX DIA 3) =====
  anti-regression:
    name: 🚨 Anti-Regression Gate (PRE_AGENDA/CONCLUIDO)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔍 Block PRE_AGENDA in executable code
      run: |
        echo "🔍 Scanning for PRE_AGENDA in Python code..."

        # Scan Python files (exclude migrations and comments-only)
        if grep -r "PRE_AGENDA" \
          --include="*.py" \
          --exclude-dir="migrations" \
          --exclude-dir="venv" \
          --exclude-dir=".venv" \
          core/ api/ ingestao/ 2>/dev/null | \
          grep -v "^[[:space:]]*#.*PRE_AGENDA" | \
          grep -v "CORRIGIDO.*PRE_AGENDA"; then

          echo "❌ BLOCKER: PRE_AGENDA found in executable code!"
          echo "Migration 0033 removed PRE_AGENDA status. Use AGENDADO or APROVADO."
          exit 1
        fi

        echo "✅ No PRE_AGENDA in executable code"

    - name: 🔍 Block CONCLUIDO in code
      run: |
        echo "🔍 Scanning for CONCLUIDO status (deprecated)..."

        # CONCLUIDO was never in canonical enum, should not exist
        if grep -r "CONCLUIDO" \
          --include="*.py" \
          --exclude-dir="migrations" \
          --exclude-dir="venv" \
          --exclude-dir=".venv" \
          core/ api/ ingestao/ 2>/dev/null | \
          grep -v "^[[:space:]]*#"; then

          echo "❌ BLOCKER: CONCLUIDO status found (never canonical)!"
          echo "Use REALIZADO for completed events."
          exit 1
        fi

        echo "✅ No CONCLUIDO status found"

  # ===== TESTES POR MÓDULO =====
  tests:
    name: 🧪 Testes por Módulo
    runs-on: ubuntu-latest
    needs: [code-quality, anti-regression]

    strategy:
      fail-fast: false
      matrix:
        test-group:
          - unit-core
          - unit-api
          - integration
          - e2e

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🏗️ Setup Django
      env:
        ENVIRONMENT: testing
        SECRET_KEY: test-secret-key-for-ci
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ALLOWED_HOSTS: localhost,127.0.0.1
        DEBUG: true
      run: |
        python manage.py check
        python manage.py makemigrations --check

    - name: 🔄 Run migrations
      env:
        ENVIRONMENT: testing
        SECRET_KEY: test-secret-key-for-ci
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: python manage.py migrate

    - name: 🧪 Run tests - ${{ matrix.test-group }}
      env:
        ENVIRONMENT: testing
        SECRET_KEY: test-secret-key-for-ci
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        case "${{ matrix.test-group }}" in
          "unit-core")
            coverage run --source='.' manage.py test core.tests.test_models core.tests.test_views --verbosity=2
            ;;
          "unit-api")
            coverage run --source='.' manage.py test api.tests --verbosity=2
            ;;
          "integration")
            coverage run --source='.' manage.py test core.tests.test_integration --verbosity=2
            ;;
          "e2e")
            python manage.py test core.tests.test_e2e --verbosity=2
            ;;
        esac
        coverage report
        coverage xml

    - name: 📊 Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: ${{ matrix.test-group }}
        name: coverage-${{ matrix.test-group }}
        token: ${{ secrets.CODECOV_TOKEN }}

  # ===== VALIDAÇÃO DE BRANCHES =====
  branch-validation:
    name: 🌳 Validação de Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: ✅ Validar nome da branch
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        echo "Branch: $BRANCH_NAME"

        # Validate branch naming pattern
        if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|hotfix|chore|docs|refactor|test)/.+$ ]]; then
          echo "❌ Branch name doesn't follow pattern: type/description"
          echo "Valid types: feat, fix, hotfix, chore, docs, refactor, test"
          echo "Example: feat/pre-agenda-system"
          exit 1
        fi

        echo "✅ Nome da branch válido!"

  # ===== DEPLOY ENVIRONMENTS =====
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [code-quality, tests]
    if: github.ref == 'refs/heads/homolog' && github.event_name == 'push'
    environment: staging

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Render (Staging)
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
      run: |
        echo "🔄 Deploying to staging environment..."
        curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'
        echo "✅ Staging deployment triggered!"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [code-quality, tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Render (Production)
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
      run: |
        echo "🔄 Deploying to production environment..."
        curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": true}'
        echo "✅ Production deployment triggered!"

  # ===== NOTIFICAÇÕES =====
  notify:
    name: 📢 Notificações
    runs-on: ubuntu-latest
    needs: [code-quality, tests]
    if: always()

    steps:
    - name: 📊 Status da Pipeline
      run: |
        if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.tests.result }}" == "success" ]]; then
          echo "✅ Pipeline executada com sucesso!"
        else
          echo "❌ Pipeline falhou. Verifique os logs."
        fi
