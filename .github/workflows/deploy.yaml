name: Build, sign and release (main)

# ESTE WORKFLOW NAO DEPLOYA. (Nome do arquivo mantido para preservar o historico de runs.)
#
# ADR-018 Fase 4 (#1516): o job `deploy` (PUT ao Portainer :9443 publico) foi DELETADO,
# junto com o `validate_existing_tag`, que so existia como `needs` dele. O deploy de
# producao e PULL-BASED: `promote.yml` (gated no Environment `production`) assina um
# ponteiro de release, e o agente aprender-deployer, na VM01, o le, verifica com cosign
# e aplica por digest em 127.0.0.1:9443 — imune ao "false-red" do :9443 publico.
#
# Aqui sobrou o que sempre foi o papel legitimo do CI: build + scan + push + assinar +
# tag/release. Promocao e rollback vivem no promote.yml.

on:
  push:
    branches:
      - main
  # Rebuild manual da main. NAO deploya, e nao promove: use o promote.yml.
  workflow_dispatch:

env:
  DOCKER_USERNAME: norjosamatheus
  BACKEND_IMAGE: norjosamatheus/aprender-backend
  FRONTEND_IMAGE: norjosamatheus/aprender-frontend

permissions:
  # Default minimo herdado por todos os jobs; quem precisa de mais declara o seu.
  # `deployments: write` era ocioso (nenhum step cria Deployment via API). #1397.
  contents: read

concurrency:
  # Serializa builds da main: a tag imutavel e o release sao criados aqui.
  group: build-sign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release context
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_mode: ${{ steps.compute.outputs.release_mode }}
      release_version: ${{ steps.compute.outputs.release_version }}
      build_date: ${{ steps.compute.outputs.build_date }}
    steps:
      - name: Compute mode and release version
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `should_build` e `target_environment` sumiram junto com o job `deploy`
          # (#1516): sem deploy, so existe um modo — buildar o commit atual. Promocao e
          # rollback de producao vivem no promote.yml (gated) + agente na VM01.
          case "$EVENT_NAME" in
            push)              release_mode="build-auto"   ;;
            workflow_dispatch) release_mode="build-manual" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac

          short_sha="${GIT_SHA:0:7}"
          release_version="v$(date -u +%Y.%m.%d)-${short_sha}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "release_mode=$release_mode"
            echo "release_version=$release_version"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

          echo "Release mode: $release_mode"
          echo "Release version: $release_version"

  build_and_push:
    name: Build, scan, and push images
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      # build/push de imagem NAO precisa escrever no repo. O git tag + gh release
      # foram movidos p/ o job `tag_and_release` (desacopla contents:write de um
      # alvo classico de supply-chain: o job que builda/pusha imagem). #1397.
      contents: read
    outputs:
      # digests dos pushes -> consumidos pelo job `sign` (assinatura por digest, ADR-018 #1524)
      backend_digest: ${{ steps.push_backend.outputs.digest }}
      frontend_digest: ${{ steps.push_frontend.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image for pre-publish scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: false
          load: true
          tags: aprender-backend:scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.release_version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

      - name: Build frontend image for pre-publish scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: false
          load: true
          tags: aprender-frontend:scan-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Generate Trivy report (backend)
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # 0.34.1
        with:
          image-ref: aprender-backend:scan-${{ github.run_id }}
          format: json
          output: trivy-backend.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Generate Trivy report (frontend)
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc # 0.34.1
        with:
          image-ref: aprender-frontend:scan-${{ github.run_id }}
          format: json
          output: trivy-frontend.json
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Enforce security gate (block HIGH/CRITICAL)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          reports = ["trivy-backend.json", "trivy-frontend.json"]
          total = 0

          for report in reports:
              with open(report, encoding="utf-8") as fp:
                  data = json.load(fp)
              for result in data.get("Results", []):
                  for vuln in result.get("Vulnerabilities", []) or []:
                      if vuln.get("Severity") in {"HIGH", "CRITICAL"}:
                          total += 1

          print(f"Total HIGH/CRITICAL vulnerabilities: {total}")
          if total > 0:
              print("Publish blocked by security gate.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        id: push_backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2
          file: ./v2/infra/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.release_version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

      - name: Build and push frontend image
        id: push_frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./v2/frontend
          file: ./v2/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  sign:
    # ADR-018 #1524: auto-assina TODA imagem de prod (cosign keyless + attestation SLSA),
    # reutilizando o slsa-provenance.yml. A identidade OIDC keyless de um reusable LOCAL
    # e slsa-provenance.yml@refs/heads/main -> casa com o IMAGE_IDENTITY_RE do agente/promote
    # (nenhuma mudanca no agente).
    #
    # A assinatura e PRE-REQUISITO do deploy: o promote.yml recusa promover imagem nao
    # assinada, e o agente recusa aplicar digest que nao passe no `cosign verify`.
    #
    # Gate `ref == main`: um dispatch a partir de outra branch assinaria com identidade
    # que o agente rejeita; entao so assina no caminho main.
    name: Sign images (cosign keyless + SLSA)
    needs: [prepare, build_and_push]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write       # cosign keyless (Fulcio) — DEVE estar no caller
      attestations: write   # actions/attest-build-provenance
      contents: read
    uses: ./.github/workflows/slsa-provenance.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_version }}
      backend_digest: ${{ needs.build_and_push.outputs.backend_digest }}
      frontend_digest: ${{ needs.build_and_push.outputs.frontend_digest }}
    secrets: inherit

  tag_and_release:
    name: Tag and GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build_and_push]
    if: needs.build_and_push.result == 'success'
    permissions:
      # Unico job com contents:write — exclusivo p/ git tag + gh release. #1397.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Create git tag if missing
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Tag ${RELEASE_VERSION} already exists. Skipping creation."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push origin "${RELEASE_VERSION}"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
        run: |
          set -euo pipefail
          {
            echo "# Release ${RELEASE_VERSION}"
            echo
            echo "- Mode: \`${RELEASE_MODE}\`"
            echo "- Deploy: nao automatico. Para levar a producao, rode o workflow"
            echo "  \`promote.yml\` com \`release=${RELEASE_VERSION}\` (gate \`production\`)."
            echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}\`"
            echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}\`"
            echo
            echo "## Pull Commands"
            echo
            echo '```bash'
            echo "docker pull ${{ env.BACKEND_IMAGE }}:${RELEASE_VERSION}"
            echo "docker pull ${{ env.FRONTEND_IMAGE }}:${RELEASE_VERSION}"
            echo '```'
          } > release_notes.md

          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_VERSION}" \
              --title "Release ${RELEASE_VERSION}" \
              --notes-file release_notes.md
          else
            gh release create "${RELEASE_VERSION}" \
              --title "Release ${RELEASE_VERSION}" \
              --notes-file release_notes.md
          fi

